id: undersized-metadata-cache
observed_at: 2026-05-17
source: project_researchmaxx_arxiv.md
agent: claude
phase: acquisition_arxiv
failure_type: cache_thrash

context_summary: |
  The arxiv metadata cache was sized for a single-paper-at-a-time
  workflow (~100 entries). Phase A's parallel fan-out hit dozens of
  papers per minute; the cache evicted entries faster than they
  could be re-used, producing a 90%+ cache-miss rate. Every miss
  re-hit export.arxiv.org, contributing to the 429 ban (see
  fixture arxiv-429-export-ban).

input:
  prompt: |
    Ingest the 40 most-recent papers from the cs.LG arxiv listing in
    parallel. Use the metadata cache to avoid re-fetching.
  env:
    ANTIEK_ARXIV_CACHE_SIZE: "100"

expected_behavior: |
  The metadata cache should be sized to the cohort the operator
  routinely hits (≥1000 entries) and tracked via cache_hits /
  cache_misses metrics so a regression is visible. The size should
  be configurable via env so the operator can crank it up without
  a code change.

actual_failure: |
  Cache thrashed at 100 entries. 90%+ miss rate. Every miss
  re-fetched. Re-fetch storm contributed to the 429 ban. Operator
  noticed only after the ban took the daemon offline for an hour.

harness_check_that_now_catches: |
  acquisition/arxiv/client.py — the export-search metadata cache is a
  URL-keyed LRU sized by ANTIEK_ARXIV_CACHE_SIZE, defaults to 1000 entries, and
  exposes cache_hits / cache_misses through arxiv_metadata_cache_stats(). When
  cache_metrics_investigation_id or ANTIEK_ARXIV_CACHE_METRICS_INVESTIGATION_ID
  is set, each lookup emits an arxiv.metadata_cache event-log row with
  cache_hits, cache_misses, cache_size, and cache_capacity. Covered by
  tests/test_acquisition_arxiv.py, including default sizing, env-capacity LRU
  eviction, no-refetch reuse, and event-log metrics.

fix_commit: SPR-08

notes: |
  Sister fixture to arxiv-429-export-ban. Fixing the cache size
  reduces the rate of re-fetches; fixing the throttle prevents
  the ban from re-triggering. Both are independent mitigations
  for the same incident class; the cache mitigation is now explicit on the
  export-search metadata boundary rather than buried in a caller.
