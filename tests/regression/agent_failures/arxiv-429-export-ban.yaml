id: arxiv-429-export-ban
observed_at: 2026-05-17
source: project_researchmaxx_arxiv.md
agent: claude
phase: acquisition_arxiv
failure_type: rate_limited

context_summary: |
  The arxiv ingestion path hit a 429 rate-limit ban from
  export.arxiv.org. The ban was IP-scoped (not API-key-scoped) and
  persisted for hours. Antiek's throttle was in-process only — a
  second invocation from another shell ignored the first's
  rate-limit history and re-triggered the ban.

input:
  prompt: |
    Ingest the latest arxiv listings for cs.LG since 2026-05-15 via
    the export.arxiv.org bulk endpoint.
  env:
    ANTIEK_ARXIV_QPS: "1.0"

expected_behavior: |
  The arxiv client should (a) maintain a cross-process throttle
  shared via file or DuckDB sentinel, (b) on receiving 429, persist a
  banned-until timestamp that subsequent invocations honor without
  re-attempting, (c) fall back to the PDF endpoint or Semantic
  Scholar (S2) when export.arxiv.org is banned.

actual_failure: |
  In-process throttle only → second shell re-attempted within the
  ban window → ban extended further. No banned_until sentinel
  persisted to disk. Eventually all arxiv ingestion paused for
  hours; operator manual intervention required.

harness_check_that_now_catches: |
  acquisition/arxiv/throttle.py — ArxivThrottle enforces >=3s
  request spacing (arXiv's stated terms-of-use ceiling) AND persists
  spacing + banned_until in a CROSS-PROCESS JSON state file, so a
  second shell honors the first's rate-limit history instead of
  re-triggering the ban. On a 429, note_response() sets a
  banned_until sentinel (Retry-After-aware, else a conservative
  30-min default); the next wait_if_needed() raises ArxivBanned so
  the batch pauses. The CLI tools/ingest_arxiv.py wraps every live
  request in this throttle and, on a real 429 raised by the search
  client OR the per-paper PDF fetch, calls note_response() (persisting
  the sentinel) and halts the batch. Closed end-to-end by
  test_live_429_pdf_fetch_sets_sentinel_and_halts_batch in
  tests/test_arxiv_ingest.py, which drives the LIVE run_batch path with
  a 429-returning fetch and asserts the banned_until sentinel is written
  to the state file and the batch backs off. The throttle mechanism
  itself is unit-covered by test_throttle_state_survives_across_instances
  + test_429_sets_ban_and_subsequent_request_raises in
  tests/test_arxiv_licenses.py.

fix_commit: SPR-02

notes: |
  Closed together with banned-until-sentinel-absent (same
  ArxivThrottle mechanism — the sentinel IS the throttle's ban
  state). See also: arxiv-missing-ssl-env (still GAP — needs a
  broader runtime/ssl_bootstrap helper, out of SPR-02 scope),
  undersized-metadata-cache (still GAP). Alternate-source (PDF/S2)
  fallback on ban is a future enhancement; the cross-process pause
  is the invariant-respecting fix shipped here.
