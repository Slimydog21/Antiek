id: arxiv-429-export-ban
observed_at: 2026-05-17
source: project_researchmaxx_arxiv.md
agent: claude
phase: acquisition_arxiv
failure_type: rate_limited

context_summary: |
  The arxiv ingestion path hit a 429 rate-limit ban from
  export.arxiv.org. The ban was IP-scoped (not API-key-scoped) and
  persisted for hours. Antiek's throttle was in-process only — a
  second invocation from another shell ignored the first's
  rate-limit history and re-triggered the ban.

input:
  prompt: |
    Ingest the latest arxiv listings for cs.LG since 2026-05-15 via
    the export.arxiv.org bulk endpoint.
  env:
    ANTIEK_ARXIV_QPS: "1.0"

expected_behavior: |
  The arxiv client should (a) maintain a cross-process throttle
  shared via file or DuckDB sentinel, (b) on receiving 429, persist a
  banned-until timestamp that subsequent invocations honor without
  re-attempting, (c) fall back to the PDF endpoint or Semantic
  Scholar (S2) when export.arxiv.org is banned.

actual_failure: |
  In-process throttle only → second shell re-attempted within the
  ban window → ban extended further. No banned_until sentinel
  persisted to disk. Eventually all arxiv ingestion paused for
  hours; operator manual intervention required.

harness_check_that_now_catches: |
  acquisition/arxiv/throttle.py — cross-process min-interval rate
  limiter (flock-serialized read-modify-write of a shared
  ~/.antiek/arxiv_throttle.state timestamp; wall-clock so it's
  comparable across processes and survives restart). Closes the root
  cause: the in-process-only throttle that let a second process ignore
  the first's request history and trip the limiter. Wired into
  acquisition/arxiv/client.py::_http_get (own-client path) alongside
  the ban sentinel from acquisition/arxiv/ban_state.py. Prevention
  (throttle) + re-trigger-stop (ban sentinel) are both closed.
  tests/test_arxiv_throttle.py proves real cross-thread serialization
  and the "second process honors the shared timestamp" property.

fix_commit: hashimoto-eng/e2-arxiv-throttle

notes: |
  Closed by the throttle + ban-sentinel pair. The (c) PDF/S2 fallback
  ROUTING — what the caller does when ArxivBanned is raised — is the
  remaining sliver, tracked as a caller change (the ArxivBanned
  exception is the seam). Prevention and re-trigger-stop, the
  load-bearing halves, are now mechanical. See also:
  arxiv-missing-ssl-env (closed), banned-until-sentinel-absent
  (closed), undersized-metadata-cache (open).
