id: banned-until-sentinel-absent
observed_at: 2026-05-17
source: project_researchmaxx_arxiv.md
agent: claude
phase: acquisition_arxiv
failure_type: missing_sentinel

context_summary: |
  When export.arxiv.org returned 429 (see fixture
  arxiv-429-export-ban), Antiek had no place to persist the
  "banned until <T>" sentinel. The natural store is either DuckDB
  (write_log table) or a file under ~/.antiek/. Without it, each
  fresh agent invocation re-checked the endpoint and re-triggered
  the ban — turning a transient rate limit into an extended outage.

input:
  prompt: |
    Resume arxiv ingestion now that the previous 429 should have
    cleared.
  env: {}

expected_behavior: |
  Before any export.arxiv.org request, the client should consult a
  shared banned_until sentinel. If the current time is before the
  sentinel, the request short-circuits and routes through the PDF
  endpoint or S2 fallback. The sentinel survives across processes
  (writes to a known path; reads with a file-lock-tolerant
  protocol).

actual_failure: |
  No sentinel was persisted. Every new shell started fresh and hit
  export.arxiv.org. The ban window kept resetting; the operator
  could not tell whether to wait or migrate. The §7 daemon (live on
  prod) was particularly bad — its cadence ensured the next request
  hit during the ban every time.

harness_check_that_now_catches: |
  acquisition/arxiv/throttle.py — ArxivThrottle persists a
  banned_until sentinel to a cross-process JSON state file (default
  under the operator's ~ .antiek runtime dir, override via the
  ANTIEK_ARXIV_THROTTLE_PATH env var). is_banned()/banned_until()
  read it; wait_if_needed() raises ArxivBanned while a ban is active
  so a fresh invocation short-circuits instead of re-hitting the
  endpoint. The sentinel is set on the LIVE path because the CLI
  (tools/ingest_arxiv.py) catches the httpx.HTTPStatusError a real 429
  raises and calls note_response() — closed end-to-end by
  test_live_429_pdf_fetch_sets_sentinel_and_halts_batch in
  tests/test_arxiv_ingest.py (asserts banned_until is actually written
  to the state file by driving run_batch with a 429-returning fetch,
  not by calling note_response directly). The sentinel read/clear
  semantics are unit-covered by
  test_429_sets_ban_and_subsequent_request_raises and
  test_ban_clears_after_window in tests/test_arxiv_licenses.py.

fix_commit: SPR-02

notes: |
  This is the LOAD-BEARING fix in the arxiv cluster. The sentinel
  closes both this fixture and arxiv-429-export-ban (same
  ArxivThrottle mechanism). PDF/S2 ENDPOINT fallback (routing a
  banned request to an alternate source) is NOT part of this
  sprint — the sentinel here makes the batch PAUSE, which is the
  invariant-respecting behavior; alternate-source fallback is a
  separate enhancement.
