# SPR-05 retrieval-substrate spike — labeled query set.
#
# SOURCE: OPERATOR_INPUTS.md §1 (the corrected synthesis: 3 grounded drafters +
# 1 adversarial author-is-grader critic, fixes applied). This is the authoritative
# query set for the run. Q15 was DROPPED by the critic (it would have seeded a
# labeled hallucination to manufacture a precision trap — that is an entailment
# problem, not a retrieval-recall problem). 19 queries remain (Q01-Q14, Q16-Q20).
#
# Provenance per query (§1 scoring protocol clause 2):
#   fixture          = relevant set frozen from tree fixtures (cited_chunk_ids etc.),
#                      tree-authored. LOAD-BEARING.
#   author-asserted  = orchestrator judgment, needs operator confirm (§0.1).
#                      DOWN-WEIGHTED in the substrate tie-break.
#   structural       = gate/precedent-driven (negative controls, §9.0 gate).
#
# Per-query `target` selects which return field is scored:
#   chunks = score relevant chunk_ids against results[].chunk_id
#   nodes  = score relevant node labels against node_matches[] (the ILIKE node
#            path search() already returns) — the whole-graph node-retrieval path.
#
# `domain` drives PER-DOMAIN recall (§1 clause 1) so the ~70%-quantum monoculture
# cannot carry the verdict.
#
# CAVEAT (load-bearing, §1 clause 5 + the task's HONESTY note): under the dim-16
# `_HashEmbedding` stub (the only embedder available in this environment — see the
# decision record), paraphrase/conceptual queries carry NO semantic structure and
# are NON-LOAD-BEARING. The `load_bearing: false` flag marks exactly those; the
# harness reports them but the decision record does not treat their recall as
# discriminating ranking quality. Run under the real all-MiniLM-L6-v2 embedder to
# make them load-bearing.

meta:
  source: "OPERATOR_INPUTS.md §1 (operator-supplied, corrected synthesis)"
  embedder_note: >
    Recall numbers under the dim-16 _HashEmbedding stub measure INDEX MECHANICS
    + SPEED, not semantic ranking quality. Paraphrase/conceptual queries are
    flagged load_bearing:false until run under the real all-MiniLM-L6-v2 embedder.
  default_top_k: 5

queries:
  - id: Q01
    type: exact-fact
    query: "QuEra neutral-atom single-qubit gate error rate at 100-qubit scale"
    target: chunks
    domain: quantum
    relevant: [c-quera-1]
    label_provenance: fixture
    load_bearing: true

  - id: Q02
    type: exact-fact
    query: "phased-array radar gain and sidelobe suppression dB"
