name: prod-parity

# SPR-07 · antiek-foundation-v2 — scheduled prod-parity probe.
#
# Probes the LIVE api.antiek.ai and asserts that the SHA it reports
# (build_sha) is an ANCESTOR of origin/main with nothing older than the lag
# budget still unshipped, and that the provider registry is non-empty.
# (It asserted exact equality with main's tip until 2026-09-21; see the
# comment on the probe step for why that reds on healthy operation.) Earlier this month a stale-SPA drift shipped
# and went undetected because nothing compared the deployed SHA against
# main. This job surfaces that drift.
#
# ── WHY THIS IS AN OPERATIONAL ALARM, NOT A REQUIRED PR GATE ─────
# This check structurally CANNOT be a PR-blocking gate. It needs the
# LIVE prod URL, which is only meaningful AFTER a deploy completes — a
# pull request has no deployed SHA to compare against (the code hasn't
# been deployed). It would also gate PRs on the health of an external
# endpoint they don't change. The workflow therefore has no pull_request
# trigger and is not a required check; it never blocks a merge.
#
# The BLOCKING surface for parity lives where the SHA is known and the
# URL is live: the post-deploy task in
# infrastructure/ansible/playbooks/deploy.yml, which fails the play on a
# non-zero exit. This split (block post-deploy, inform on a schedule) is
# the standing informational-gate discipline:
# docs/decisions/ci-informational-gates.md.
#
# This job RUNS the real check and preserves its exit code. A scheduled or
# operator-triggered run goes red on blocking SHA/provider/transport failures,
# making the Actions signal honest without coupling it to pull requests.

on:
  schedule:
    # Daily at 07:13 UTC. Off the hour to dodge GitHub's scheduler
    # contention at :00. A stale deploy that survives an operator's
    # eyeball gets caught within a day.
    - cron: "13 7 * * *"
  workflow_dispatch:  # let the operator probe prod on demand from the Actions tab

concurrency:
  # Was `group: prod-parity` with no ref and no event — a single
  # repository-global slot, so ANY run cancelled any other. A manual
  # workflow_dispatch would kill the scheduled parity check that was
  # mid-probe, and two scheduled runs could not overlap at all. This is the
  # only always-on alarm that production matches main; it must not be able
  # to cancel itself. Give each run its own slot and never cancel.
  group: prod-parity-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe prod /health vs origin/main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need history so `git rev-parse origin/main` resolves the real
          # remote tip (the default-branch SHA we expect prod to be on).
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Probe prod parity
        # Defaults --expected-sha to `git rev-parse origin/main`. The checker
        # itself keeps flywheel maturity informational by default, while SHA,
        # provider-registry, and transport failures propagate as non-zero.
        # --max-lag-hours turns the SHA assertion from "equals main's tip"
        # into "is an ancestor of main, and nothing older than the budget is
        # still unshipped". Exact equality is the right contract for the
        # POST-DEPLOY check in ansible (you shipped X, prod must report X) and
        # is unchanged there — the flag defaults to 0, which is exact.
        #
        # It is the wrong contract for THIS daily probe. With automatic
        # deploys main advances while a deploy is in flight, so equality is
        # false for a window after every merge. Measured 2026-09-21: this job
        # had failed 30 of its last 100 scheduled runs and 13 of the last 15,
        # while prod was provably healthy (an ancestor of main, oldest
        # unshipped commit 0.6h old, 5 providers, flywheel live). An alarm
        # that reds on correct operation is one nobody reads — see dep_audit,
        # red for nine weeks.
        #
        # 6h: comfortably longer than any real deploy, far shorter than the
        # "survives an operator's eyeball" staleness this job exists to catch.
        # A fork or rollback still fails immediately, at ANY budget.
        run: |
          python tools/prod_parity/check.py \
            --url https://api.antiek.ai \
            --max-lag-hours 6
