# AGH SPR-08 — weekly dependency-vulnerability audit. INFORMATIONAL BY
# TRIGGER, not by swallow: this workflow runs only on a schedule and on
# manual dispatch — it can never gate a PR — and precisely because it gates
# nothing, its failures are left LOUD (no `|| true`, no continue-on-error).
# A red run here means "an advisory needs human eyes", which is the entire
# point. (Contrast prod_parity's historical continue-on-error, which made
# its signal structurally invisible — the defect class AGH SPR-04 removed.)
name: dep_audit
on:
  schedule:
    # Weekly, Mondays 07:41 UTC — off the hour to dodge scheduler congestion,
    # matching the prod_parity convention.
    - cron: "41 7 * * 1"
  workflow_dispatch: {}

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reading
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: npm audit (runtime deps, high+)
        # --omit=dev: the shipped bundle's exposure is what pages someone.
        # Dev-tree advisories arrive via the full report below + dependabot.
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (full report, informational tail)
        if: always()
        run: npm audit || true  # full-tree visibility only; the gate above already fired honestly

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: pip-audit against the pinned constraints lock
        # tools/lints/constraints.txt is the repo's full pinned resolution
        # (the same lock enforce_declared_bar installs under) — auditing it
        # audits what CI actually runs.
        # NOTE: no --disable-pip — that flag requires hashed requirements,
        # and constraints.txt is pinned-but-unhashed (caught by adversarial
        # review before this ever ran: the job would have false-redded with
        # a tooling error on day one).
        run: |
          pip install pip-audit
          pip-audit -r tools/lints/constraints.txt

  pip-audit-prod:
    # THE GAP THIS CLOSES. The job above is honestly scoped — it says it
    # audits "what CI actually runs", and that is exactly true:
    # tools/lints/constraints.txt is installed by 7 CI workflows and by
    # ZERO production paths. Production installs
    #   {{ antiek_install_dir }}[pdf,urls,embedding,docs,turbopuffer_shadow]
    # editable from pyproject.toml with NO `-c constraints.txt`
    # (infrastructure/ansible/playbooks/deploy.yml). So nothing in this
    # repo measured production's dependency exposure at all. Nine weeks of
    # red on the lock job were therefore unreadable as a production signal
    # rather than ignored — the number for prod did not exist.
    #
    # WHAT THIS MEASURES, EXACTLY: the set a FRESH deploy would resolve
    # today. That is a proxy, and the residual gap is real enough to name
    # rather than paper over. The ansible pip task leaves `state` unset, so
    # it defaults to `present` and never passes --upgrade; pyproject's
    # bounds are open (cryptography>=42.0, pypdf>=4.3), so a requirement
    # that is already satisfied is NOT bumped by a deploy. /opt/antiek/.venv
    # can therefore hold a version older than anything resolved here, and
    # /health returns 30 keys of which none is a dependency version, so the
    # live set is unreadable from outside. Closing THAT needs a deploy-time
    # freeze artifact; this job is the strongest signal obtainable from the
    # repo alone, and it is a strict improvement on having none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: resolve the production extras set, unconstrained
        # Deliberately NO `-c tools/lints/constraints.txt`: constraining
        # here would re-audit the lock and reproduce the very blind spot
        # this job exists to remove.
        run: |
          python -m venv /tmp/prodenv
          /tmp/prodenv/bin/pip install --quiet --upgrade pip
          /tmp/prodenv/bin/pip install -e ".[pdf,urls,embedding,docs,turbopuffer_shadow]"
          /tmp/prodenv/bin/pip freeze --exclude-editable > /tmp/prod-resolved.txt
      - name: assert the resolved set is real before auditing it
        # Anti-vacuity guard. `pip-audit -r` over an empty or truncated file
        # exits 0 and reads as "no vulnerabilities" — a failed resolve, a
        # renamed freeze flag, or a moved path would each manufacture that
        # false green. 20 core deps + 9 extra deps + transitives is
        # comfortably >= 30, so a smaller number means the resolve did not
        # happen rather than that production is lean.
        run: |
          n=$(grep -cE '^[A-Za-z0-9._-]+==' /tmp/prod-resolved.txt || true)
          echo "resolved $n pinned production packages"
          if [ "$n" -lt 30 ]; then
            echo "::error::resolved only $n packages — refusing to report a green audit over nothing"
            exit 1
          fi
      - name: pip-audit the production-resolved set
        # --no-deps is valid here precisely BECAUSE the input is `pip
        # freeze` output: a complete, fully-pinned closure needs no further
        # resolution. (Contrast the lock job's note on --disable-pip, which
        # is unusable there for a different reason: it demands hashes.)
        run: |
          pip install pip-audit
          pip-audit --no-deps -r /tmp/prod-resolved.txt
      - name: publish the resolved production set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-resolved-requirements
          path: /tmp/prod-resolved.txt
