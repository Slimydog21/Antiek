# Test-integrity floor — Antiek × Beck Test-Integrity spec
# (~/specs/antiek-beck-test-integrity/). Wires SPR-02 (fake-gate detector),
# SPR-03 (desiderata lint), and SPR-05 (mock-budget gate) as one additive
# workflow. Each step is INFORMATIONAL per docs/decisions/ci-informational-gates.md:
# it runs, prints full findings to the log, surfaces a ::warning:: on nonzero
# tool exit, and always exits 0 so the job never reds on a grandfathered backlog.
# Flip-to-blocking is operator-only, one gate at a time, per
# docs/decisions/test-integrity-ci-floor.md. ci.yml and the other four
# workflows own hard gates such as Python reachability.

name: test-integrity

on:
  pull_request:
    paths:
      - 'tools/test_census.py'
      - 'tools/test_census_baseline.json'
      - 'tools/fake_gate_detector.py'
      - 'tools/flaky_quarantine.py'
      - 'tools/flaky_quarantine_pytest.py'
      - 'tools/pytest_quarantine_plugin.py'
      - 'tools/lint/**'
      - 'tools/lints/baselines/**'
      - 'tools/tests/**'
      - 'mutants/**'
      - 'tests/quarantine.toml'
      - '.github/workflows/test_integrity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/test_census.py'
      - 'tools/test_census_baseline.json'
      - 'tools/fake_gate_detector.py'
      - 'tools/flaky_quarantine.py'
      - 'tools/flaky_quarantine_pytest.py'
      - 'tools/pytest_quarantine_plugin.py'
      - 'tools/lint/**'
      - 'tools/lints/baselines/**'
      - 'tools/tests/**'
      - 'mutants/**'
      - 'tests/quarantine.toml'
      - '.github/workflows/test_integrity.yml'

concurrency:
  # One run per PR branch: a new push to a PR cancels the previous run,
  # because only the latest head of a PR is worth checking. main is
  # different — every commit there is a release candidate, so its run must
  # reach a verdict. Keying main by `github.ref` with cancel-in-progress
  # meant each merge cancelled the previous merge's run; on ci.yml that
  # produced 32 cancelled / 8 failure / ZERO success over 40 main runs
  # before #3203 fixed it. This one is informational by design (see
  # docs/decisions/ci-informational-gates.md), but a cancelled run still
  # publishes nothing, so main loses the signal entirely.
  group: test-integrity-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-integrity-floor:
    name: test-integrity-floor
    runs-on: ubuntu-latest
    # Fake-gate detector runs bounded mutation (9 mutants × pytest selectors);
    # budget is well under the main-suite ceiling but leave headroom.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        # Was pinned to 3.11, which cannot parse PEP 695 generic syntax. main
        # uses it in three files — acquisition/arxiv/rate_governor.py,
        # acquisition/fmp/client.py, acquisition/polygon/client.py — e.g.
        #   def governed_request[ResponseT: _ResponseLike](
        # The fake-gate detector ast.parse()s each file it mutates, so under
        # 3.11 it died on the first of these with `SyntaxError: expected '('`
        # and scanned nothing afterwards, while this workflow still reported
        # success. 3.14 matches ci.yml, enforce_declared_bar.yml,
        # agent_execution_gates.yml, dep_audit.yml and prod_parity.yml.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install (core + dev extras the detector selectors need)
        run: |
          python -m pip install --upgrade pip
          # AGH SPR-04 (G4): pin under the declared-bar lock — see ci.yml.
          pip install -c tools/lints/constraints.txt -e ".[dev,arxiv,pdf,urls,embedding,youtube,rss]"

      - name: Fake-gate detector (informational)
        # SPR-02: bounded mutation-lite. --enforce prints the full survivor
        # report (path:line, rationale, selector) to the log, then exits 1 ONLY
        # on a NEW fake gate not in mutants/survivors_baseline.json.
        # Grandfathered survivors still print (loud, not silenced) but exit 0.
        run: |
          set +e
          out=$(python -m tools.fake_gate_detector --enforce 2>&1)
          rc=$?
          printf '%s\n' "$out"
          # A crash and a finding both exit nonzero. Reporting them the same
          # way made a tool that scanned NOTHING indistinguishable from one
          # that scanned everything and found a backlog — which is how a
          # detector that had been dead since the PEP 695 files landed kept
          # showing up as a routine informational warning.
          if printf '%s\n' "$out" | grep -q '^Traceback (most recent call last):'; then
            echo "::warning title=Fake-gate detector CRASHED — no coverage::The tool raised instead of reporting, so this run scanned nothing. Do not read it as a clean pass. Traceback above."
          elif [ "$rc" -ne 0 ]; then
            echo "::warning title=Fake-gate detector is informational on CI::NEW fake-gate finding(s) detected (exit $rc). Full path:line list above. Flip to blocking per docs/decisions/test-integrity-ci-floor.md when the reconsider-if is met."
          fi
          exit 0

      - name: Test-desiderata lint (informational)
        # SPR-03: AST lint over tests/. Prints every path:line violation to
        # stdout before exiting 1 on any finding backlog.
        run: |
          set +e
          out=$(python -m tools.lint.test_desiderata_check --rule all 2>&1)
          rc=$?
          printf '%s\n' "$out"
          # A crash and a finding both exit nonzero. Reporting them the same
          # way made a tool that scanned NOTHING indistinguishable from one
          # that scanned everything and found a backlog — which is how a
          # detector that had been dead since the PEP 695 files landed kept
          # showing up as a routine informational warning.
          if printf '%s\n' "$out" | grep -q '^Traceback (most recent call last):'; then
            echo "::warning title=Test-desiderata lint CRASHED — no coverage::The tool raised instead of reporting, so this run scanned nothing. Do not read it as a clean pass. Traceback above."
          elif [ "$rc" -ne 0 ]; then
            echo "::warning title=Test-desiderata lint is informational on CI::Desiderata violation backlog present (exit $rc). Full path:line list above. Flip to blocking per docs/decisions/test-integrity-ci-floor.md when the reconsider-if is met."
          fi
          exit 0

      - name: Mock-budget gate (informational)
        # SPR-05: per-module mock-ratio one-way ratchet against
        # tools/lints/baselines/mock_budget.json. Prints offending tests on
        # upward regression before exiting 1.
        run: |
          set +e
          out=$(python -m tools.lint.mock_budget_check enforce --baseline-file tools/lints/baselines/mock_budget.json 2>&1)
          rc=$?
          printf '%s\n' "$out"
          # A crash and a finding both exit nonzero. Reporting them the same
          # way made a tool that scanned NOTHING indistinguishable from one
          # that scanned everything and found a backlog — which is how a
          # detector that had been dead since the PEP 695 files landed kept
          # showing up as a routine informational warning.
          if printf '%s\n' "$out" | grep -q '^Traceback (most recent call last):'; then
            echo "::warning title=Mock-budget gate CRASHED — no coverage::The tool raised instead of reporting, so this run scanned nothing. Do not read it as a clean pass. Traceback above."
          elif [ "$rc" -ne 0 ]; then
            echo "::warning title=Mock-budget gate is informational on CI::Mock-ratio regression detected (exit $rc). Module + offending tests above. Flip to blocking per docs/decisions/test-integrity-ci-floor.md when the reconsider-if is met."
          fi
          exit 0
