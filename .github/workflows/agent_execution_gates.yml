name: Agent execution gates

# ANT-EXEC-H2V SPR-09 — fast hermetic gates for handoff/cascade theater (F1–F3).
# Does not replace full pytest CI; blocks merge on agent-execution regressions only.

on:
  push:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'orchestration/**'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - 'tests/test_deep_research_complete.py'
      - 'tests/test_cascade_session.py'
      - 'tests/test_loop_one_orchestrator.py'
      - 'tests/test_research_runner.py'
      - 'tests/test_knowledge_reuse_spr06.py'
      - 'tests/test_flywheel_reuse.py'
      - 'tests/test_session_evidence_pack.py'
      - 'tests/test_cascade_convergence.py'
      - '.github/workflows/agent_execution_gates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'orchestration/**'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - 'tests/test_deep_research_complete.py'
      - 'tests/test_cascade_session.py'
      - 'tests/test_loop_one_orchestrator.py'
      - 'tests/test_research_runner.py'
      - 'tests/test_knowledge_reuse_spr06.py'
      - 'tests/test_flywheel_reuse.py'
      - 'tests/test_session_evidence_pack.py'
      - 'tests/test_cascade_convergence.py'
      - '.github/workflows/agent_execution_gates.yml'
  workflow_dispatch:

concurrency:
  group: agent-exec-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-execution-gates:
    name: agent-execution-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep (audit scripts use rg; not on ubuntu-latest by default)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + canonical deep-research deps
        run: |
          python -m pip install -U pip
          # AGH SPR-04 (G4): pin under the declared-bar lock — see ci.yml.
          # canonical_verify deep-research imports the API application, whose
          # upload routes eagerly import the PDF reader during collection.
          pip install -c tools/lints/constraints.txt -e ".[dev,pdf]"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install reading app deps (vitest handoff)
        working-directory: apps/reading
        run: npm ci

      - name: Canonical verify — agent-gates
        run: ./scripts/canonical_verify.sh agent-gates

      - name: Canonical verify — cascade (hermetic)
        run: ./scripts/canonical_verify.sh cascade

      - name: Handoff fixture — pass path
        run: ./scripts/canonical_verify.sh handoff tests/fixtures/agent_execution/handoff_pass.md

      - name: Canonical verify — deep-research (P-11..P-15)
        run: ./scripts/canonical_verify.sh deep-research
