name: Agent execution gates

# ANT-EXEC-H2V SPR-09 — fast hermetic gates for handoff/cascade theater (F1–F3).
# Does not replace full pytest CI; blocks merge on agent-execution regressions only.

on:
  push:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'orchestration/**'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - 'tests/test_deep_research_complete.py'
      - 'tests/test_cascade_session.py'
      - 'tests/test_loop_one_orchestrator.py'
      - 'tests/test_research_runner.py'
      - 'tests/test_knowledge_reuse_spr06.py'
      - 'tests/test_flywheel_reuse.py'
      - 'tests/test_session_evidence_pack.py'
      - 'tests/test_cascade_convergence.py'
      - '.github/workflows/agent_execution_gates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'orchestration/**'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - 'tests/test_deep_research_complete.py'
      - 'tests/test_cascade_session.py'
      - 'tests/test_loop_one_orchestrator.py'
      - 'tests/test_research_runner.py'
      - 'tests/test_knowledge_reuse_spr06.py'
      - 'tests/test_flywheel_reuse.py'
      - 'tests/test_session_evidence_pack.py'
      - 'tests/test_cascade_convergence.py'
      - '.github/workflows/agent_execution_gates.yml'
  workflow_dispatch:

concurrency:
  # One run per PR branch: a new push to a PR cancels the previous run,
  # because only the latest head of a PR is worth checking. main is
  # different — every commit there is a release candidate, so its run must
  # reach a verdict. Keying main by `github.ref` with cancel-in-progress
  # meant each merge cancelled the previous merge's run; on ci.yml that
  # produced 32 cancelled / 8 failure / ZERO success over 40 main runs
  # before #3203 fixed it. Same shape, same consequence.
  group: agent-exec-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-execution-gates:
    name: agent-execution-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep (audit scripts use rg; not on ubuntu-latest by default)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + canonical deep-research deps
        run: |
          python -m pip install -U pip
          # AGH SPR-04 (G4): pin under the declared-bar lock — see ci.yml.
          # canonical_verify deep-research imports the API application, whose
          # upload routes eagerly import the PDF reader during collection.
          pip install -c tools/lints/constraints.txt -e ".[dev,pdf]"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install reading app deps (vitest handoff)
        working-directory: apps/reading
        run: npm ci

      - name: Canonical verify — agent-gates
        # Every OTHER mode's success sentinel is asserted in
        # tests/test_canonical_verify.py — profile, cascade, deep-research,
        # handoff and html-transport each assert
        # "CANONICAL_VERIFY_OK: <mode>" in stdout, not merely returncode == 0.
        # agent-gates is the one mode with no such test, because it runs
        # `npm run test:handoff` and the Python pytest shards do not install
        # node_modules. That left a hole: replacing the body with
        # `cmd_agent_gates() { return 0; #` makes the script exit 0, this step
        # stay green, and all 8 tests still pass — verified 2026-09-22.
        #
        # The assertion therefore lives here, where npm exists. pipefail makes
        # a failure inside the script fail the step; the grep makes a silent
        # success fail it too.
        run: |
          set -euo pipefail
          out=$(./scripts/canonical_verify.sh agent-gates 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'CANONICAL_VERIFY_OK: agent-gates'

      - name: Canonical verify — cascade (hermetic)
        run: ./scripts/canonical_verify.sh cascade

      - name: Handoff fixture — pass path
        run: ./scripts/canonical_verify.sh handoff tests/fixtures/agent_execution/handoff_pass.md

      - name: Canonical verify — deep-research (P-11..P-15)
        run: ./scripts/canonical_verify.sh deep-research
