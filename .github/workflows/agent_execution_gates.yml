name: Agent execution gates

# ANT-EXEC-H2V SPR-09 — fast hermetic gates for handoff/cascade theater (F1–F3).
# Does not replace full pytest CI; blocks merge on agent-execution regressions only.

on:
  push:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/repro_cascade_decompose_contract.py'
      - 'scripts/audit_decomposer_call_sites.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'apps/reading/src/api/research.ts'
      - 'apps/reading/src/modes/DeepResearchWorkspace/**'
      - 'interfaces/research/api/cascade_routes.py'
      - 'interfaces/research/api/books.py'
      - 'orchestration/cascade_session.py'
      - 'substrate/books/**'
      - 'substrate/gap_detection/**'
      - 'substrate/contracts/read_sprint_lock.py'
      - 'substrate/research_bridge/detect_external.py'
      - 'substrate/research_bridge/extractors.py'
      - 'substrate/research_bridge/ingest_file.py'
      - 'substrate/research_bridge/versioning.py'
      - 'substrate/speak/drw_gap_source.py'
      - 'substrate/speak/interviewer_context.py'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_cascade_planner.py'
      - 'tests/test_cascade_api.py'
      - 'tests/test_cascade_create_plan_light.py'
      - 'tests/test_parallel_orchestration.py'
      - 'tests/test_book_corpus_gate.py'
      - 'tests/test_contracts_read_lock.py'
      - 'tests/test_gap_detection.py'
      - 'tests/test_speak_drw_gap_source.py'
      - 'tests/test_universal_ingest.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - '.github/workflows/agent_execution_gates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/agent-execution/**'
      - 'tools/agent/**'
      - 'scripts/canonical_verify.sh'
      - 'scripts/repro_cascade_decompose_contract.py'
      - 'scripts/audit_decomposer_call_sites.sh'
      - 'scripts/audit_agent_session.sh'
      - 'scripts/agent_ams_ref_lint.sh'
      - 'apps/reading/src/api/research.ts'
      - 'apps/reading/src/modes/DeepResearchWorkspace/**'
      - 'interfaces/research/api/cascade_routes.py'
      - 'interfaces/research/api/books.py'
      - 'orchestration/cascade_session.py'
      - 'substrate/books/**'
      - 'substrate/gap_detection/**'
      - 'substrate/contracts/read_sprint_lock.py'
      - 'substrate/research_bridge/detect_external.py'
      - 'substrate/research_bridge/extractors.py'
      - 'substrate/research_bridge/ingest_file.py'
      - 'substrate/research_bridge/versioning.py'
      - 'substrate/speak/drw_gap_source.py'
      - 'substrate/speak/interviewer_context.py'
      - 'tests/fixtures/agent_execution/**'
      - 'tests/test_audit_agent_session.py'
      - 'tests/test_canonical_verify.py'
      - 'tests/test_cascade_planner.py'
      - 'tests/test_cascade_api.py'
      - 'tests/test_cascade_create_plan_light.py'
      - 'tests/test_parallel_orchestration.py'
      - 'tests/test_book_corpus_gate.py'
      - 'tests/test_contracts_read_lock.py'
      - 'tests/test_gap_detection.py'
      - 'tests/test_speak_drw_gap_source.py'
      - 'tests/test_universal_ingest.py'
      - 'tests/test_agent_ams_ref_lint.py'
      - '.github/workflows/agent_execution_gates.yml'
  workflow_dispatch:

concurrency:
  group: agent-exec-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-execution-gates:
    name: agent-execution-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep (audit scripts use rg; not on ubuntu-latest by default)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + dev deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install reading app deps (vitest handoff)
        working-directory: apps/reading
        run: npm ci

      - name: Canonical verify — agent-gates
        run: ./scripts/canonical_verify.sh agent-gates

      - name: Canonical verify — cascade (hermetic)
        run: ./scripts/canonical_verify.sh cascade

      - name: Canonical verify — read foundation
        run: ./scripts/canonical_verify.sh read-foundation

      - name: Handoff fixture — pass path
        run: ./scripts/canonical_verify.sh handoff tests/fixtures/agent_execution/handoff_pass.md
