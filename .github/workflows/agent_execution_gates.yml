concurrency:
  group: agent-exec-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-execution-gates:
    name: agent-execution-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep (audit scripts use rg; not on ubuntu-latest by default)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + dev deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install reading app deps (vitest handoff)
        working-directory: apps/reading
        run: npm ci

      - name: Canonical verify — agent-gates
        run: ./scripts/canonical_verify.sh agent-gates

      - name: Canonical verify — cascade (hermetic)
        run: ./scripts/canonical_verify.sh cascade

      - name: Canonical verify — read foundation
        run: ./scripts/canonical_verify.sh read-foundation

      - name: Canonical verify — read library
        run: ./scripts/canonical_verify.sh read-library

      - name: Canonical verify — read reader
        run: ./scripts/canonical_verify.sh read-reader

      - name: Canonical verify — read curate
        run: ./scripts/canonical_verify.sh read-curate

      - name: Canonical verify — read ad border
        run: ./scripts/canonical_verify.sh read-ad-border

      - name: Canonical verify — read voice notes
        run: ./scripts/canonical_verify.sh read-voice-notes

      - name: Canonical verify — read rabbit hole
        run: ./scripts/canonical_verify.sh read-rabbit-hole

      - name: Canonical verify — read passage research
        run: ./scripts/canonical_verify.sh read-passage-research

      - name: Canonical verify — read ad escrow
        run: ./scripts/canonical_verify.sh read-ad-escrow

      - name: Canonical verify — write outline block
        run: ./scripts/canonical_verify.sh write-outline-block

      - name: Canonical verify — write edit capture
        run: ./scripts/canonical_verify.sh write-edit-capture

      - name: Canonical verify — write block repository
        run: ./scripts/canonical_verify.sh write-block-repository

      - name: Canonical verify — write structured editor
        run: ./scripts/canonical_verify.sh write-structured-editor

      - name: Canonical verify — write brainstorm interview
        run: ./scripts/canonical_verify.sh write-brainstorm-interview

      - name: Canonical verify — write draft generation style
        run: ./scripts/canonical_verify.sh write-draft-generation-style

      - name: Canonical verify — write trace to source
        run: ./scripts/canonical_verify.sh write-trace-to-source

      - name: Canonical verify — write pre-outline freeform
        run: ./scripts/canonical_verify.sh write-pre-outline-freeform

      - name: Canonical verify — write style conditioning
        run: ./scripts/canonical_verify.sh write-style-conditioning

      - name: Canonical verify — speak consent rights gate
        run: ./scripts/canonical_verify.sh speak-consent-rights-gate

      - name: Handoff fixture — pass path
        run: ./scripts/canonical_verify.sh handoff tests/fixtures/agent_execution/handoff_pass.md
