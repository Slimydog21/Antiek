name: Runtime security dependency compatibility

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - infrastructure/requirements-security.txt
      - infrastructure/ansible/tasks/python-dependencies.yml
      - infrastructure/ansible/playbooks/deploy.yml
      - infrastructure/ansible/playbooks/setup.yml
      - tests/test_deployment_dependencies.py
      - tests/test_runtime_security_dependencies.py
      - services/antiek_format/**
      - .github/workflows/runtime-security-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install application and upgraded acquisition libraries
        run: python -m pip install -r infrastructure/requirements-security.txt -e '.[dev,pdf,youtube]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Exercise real cryptography, PDF and metadata operations
        run: >-
          python -m pytest tests/test_deployment_dependencies.py
          tests/test_runtime_security_dependencies.py services/antiek_format/tests -q
