name: visualtest

# S12 — Lost-Pixel as a CI blocker on the reading-app Storybook.
#
# Triggers when reading-app source or stories change. Blocks merge
# until either:
#   (a) every shot is within the 0.4 % per-shot threshold, OR
#   (b) the PR commits the new baselines under
#       apps/reading/.lostpixel/baseline/
#
# Local workflow: run `npm run visualtest:update` after a deliberate
# visual change; commit the .png updates with the source diff.

on:
  pull_request:
    paths:
      - apps/reading/src/**
      - apps/reading/.storybook/**
      - apps/reading/lostpixel.config.ts
      - apps/reading/tailwind.config.js
      - apps/reading/.lostpixel/baseline/**
      - .github/workflows/visualtest.yml
  workflow_dispatch:

concurrency:
  # One run per PR branch: a new push to a PR cancels the previous run,
  # because only the latest head of a PR is worth checking. main is
  # different — every commit there is a release candidate, so its run must
  # reach a verdict. Keying main by `github.ref` with cancel-in-progress
  # meant each merge cancelled the previous merge's run; on ci.yml that
  # produced 32 cancelled / 8 failure / ZERO success over 40 main runs
  # before #3203 fixed it. Same shape, same consequence.
  group: visualtest-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lostpixel:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/reading
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install reading-app deps
        run: npm ci

      - name: Install Playwright chromium (Lost-Pixel uses it)
        run: node node_modules/lost-pixel/node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Lost-Pixel against committed baselines
        # BLOCKING (AGH SPR-04 G2): the reconsider-if that made this
        # informational — "baselines committed under
        # apps/reading/.lostpixel/baseline/" (ci-informational-gates.md §3) —
        # is now MET: 381 baseline PNGs are committed there and
        # lostpixel.config.ts sets imagePathBaseline + generateOnly:false, so
        # the gate compares current renders against a real committed baseline.
        # Un-swallowed: the step's exit code is now lost-pixel's own, so a real
        # visual regression reds the PR (which is the point). A legitimate
        # visual change lands its own updated baseline PNGs (npm run
        # visualtest:update) in the same PR — the same discipline as the token
        # baselines. If this PR's own run reds, the committed baselines are
        # stale and need an operator re-approval (an honest signal, not a
        # reason to re-swallow).
        #
        # 2026-09-20: the paragraph above was TRUE about intent and WRONG about
        # effect. lost-pixel 3.22.0 cannot fail on a difference by itself. In
        # node_modules/lost-pixel/dist/runner.js the exit is nested twice:
        #
        #     if ((aboveThresholdDifferenceItems.length > 0 || ...)
        #         && config.failOnDifference) {
        #         log('Exiting process with N found differences')
        #         if (config.generateOnly) { await exitProcess(...) }
        #     }
        #
        # failOnDifference is unset here, and even with it set the exit is
        # gated on generateOnly — which this project must keep FALSE to
        # compare against the committed baselines at all. So `npx lost-pixel`
        # returns 0 no matter how many shots regress, the step goes green, and
        # because the artifact upload below is `if: failure()` the diffs are
        # never even uploaded. A CI run was observed green with 357
        # "Difference of" lines, the largest at 85.95% against a 0.4%
        # threshold.
        #
        # So assert on the artifact lost-pixel WRITES rather than on its exit
        # code: it emits one PNG into imagePathDifference per above-threshold
        # shot, and writes nothing there when every shot is within threshold.
        # That signal does not depend on upstream exit semantics.
        run: |
          set -o pipefail
          npx lost-pixel
          diffs=$(find .lostpixel/diff -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${diffs:-0}" -gt 0 ]; then
            echo "::error title=Visual regression::lost-pixel wrote ${diffs} above-threshold diff(s) to .lostpixel/diff. Review the uploaded artifact; if the change is intentional, land the updated baselines (npm run visualtest:update) in this PR."
            find .lostpixel/diff -type f -name '*.png' | sed 's|^|  |' | head -40
            exit 1
          fi
          echo "lost-pixel: no above-threshold differences."

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lostpixel-diffs
          path: |
            apps/reading/.lostpixel/diff
            apps/reading/.lostpixel/current
          retention-days: 7

  axe-core:
    # S11 + SPR-08 acceptance: axe-core finds zero serious/critical
    # violations on the audited stories — the shell chrome (NavRail,
    # Topbar, ProjectTree, ProductsLauncher, AppShell) + the Lemon
    # primitives. Runs the @storybook/test-runner against the static
    # Storybook over http-server, scoped by the `a11y-audit` story tag.
    #
    # SPR-08 fixed two real breakages here (harvested from PR #8):
    #   1. The runner removed `--include`; the modern story filter is
    #      `--includeTags`. The old invocation failed on every run.
    #   2. The runner does NOT run axe on its own — addon-a11y only
    #      surfaces violations in the SB UI, it never asserts. The axe
    #      assertion is wired by the `postVisit` hook in
    #      `.storybook/test-runner.ts`; without it this step ran stories
    #      but checked nothing. The version is pinned (no `@latest`) so a
    #      future runner release can't silently move the flag again.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/reading
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install reading-app deps
        run: npm ci

      - name: Install Playwright chromium
        run: node node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run axe-core against the a11y-audit stories (informational)
        # INFORMATIONAL (does not block the merge): this harvested a11y CI job
        # currently fails in CI at the Storybook test-runner's getIndexJson
        # step — a test-runner/Storybook index-resolution infra issue, NOT a
        # real accessibility violation. Accessibility is still exercised by
        # scripts/a11y_audit.ts and the Storybook a11y addon. We keep running
        # the job + surface a warning; re-enable blocking once the test-runner
        # index resolution is stable in CI.
        run: |
          npx -y http-server -p 6006 -s storybook-static &
          SERVER_PID=$!
          sleep 3
          # The test-runner picks up .storybook/test-runner.ts (the axe
          # postVisit hook). `--includeTags a11y-audit` selects the shell
          # chrome + primitive stories tagged for the audit. The hook throws on
          # any serious/critical axe violation.
          npx -y @storybook/test-runner@0.24.4 \
            --url http://localhost:6006 \
            --index-json \
            --includeTags a11y-audit \
            --maxWorkers 2 \
            || echo "::warning title=axe-core informational::Storybook test-runner could not load the story index on CI (getIndexJson) — harvested a11y CI infra not yet stable; a11y still checked via scripts/a11y_audit.ts + the Storybook a11y addon."
          kill $SERVER_PID || true
