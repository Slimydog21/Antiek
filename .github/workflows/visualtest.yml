name: visualtest

# S12 — Lost-Pixel as a CI blocker on the reading-app Storybook.
#
# Triggers when reading-app source or stories change. Blocks merge
# until either:
#   (a) every shot is within the 0.4 % per-shot threshold, OR
#   (b) the PR commits the new baselines under
#       apps/reading/.lostpixel/baseline/
#
# Local workflow: run `npm run visualtest:update` after a deliberate
# visual change; commit the .png updates with the source diff.

on:
  pull_request:
    paths:
      - apps/reading/src/**
      - apps/reading/.storybook/**
      - apps/reading/lostpixel.config.ts
      - apps/reading/tailwind.config.js
      - apps/reading/.lostpixel/baseline/**
      - .github/workflows/visualtest.yml
  workflow_dispatch:

concurrency:
  group: visualtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lostpixel:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/reading
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install reading-app deps
        run: npm ci

      - name: Install Playwright chromium (Lost-Pixel uses it)
        run: node node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Lost-Pixel against committed baselines
        run: npx lost-pixel
        # If the threshold fires, lost-pixel exits non-zero → job fails →
        # PR cannot merge until baselines are updated.

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lostpixel-diffs
          path: |
            apps/reading/.lostpixel/diff
            apps/reading/.lostpixel/current
          retention-days: 7

  axe-core:
    # S11 + SPR-08 acceptance: axe-core finds zero serious/critical
    # violations on the audited stories — the shell chrome (rail, tree,
    # scene chrome, launcher, stub) + the composed four-workflow walk.
    # Runs the @storybook/test-runner against the static Storybook over
    # http-server, scoped by the `a11y-audit` story tag.
    #
    # SPR-08 fixed two real breakages here:
    #   1. The runner removed `--include`; the modern story filter is
    #      `--includeTags`. The old invocation failed on every run.
    #   2. The runner does NOT run axe on its own — addon-a11y only
    #      surfaces violations in the SB UI, it never asserts. The axe
    #      assertion is wired by the `postVisit` hook in
    #      `.storybook/test-runner.ts` (added in SPR-08); without it this
    #      step ran stories but checked nothing. The version is pinned
    #      (no `@latest`) so a future runner release can't silently move
    #      the flag again.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/reading
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install reading-app deps
        run: npm ci

      - name: Install Playwright chromium
        run: node node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run axe-core against the a11y-audit stories
        run: |
          npx -y http-server -p 6006 -s storybook-static &
          SERVER_PID=$!
          sleep 3
          # The test-runner picks up .storybook/test-runner.ts (the axe
          # postVisit hook). `--includeTags a11y-audit` selects the shell
          # chrome + primitive stories tagged for the audit; index-json
          # mode is auto-detected for SB 8. The hook throws on any
          # serious/critical axe violation, failing the job.
          npx -y @storybook/test-runner@0.24.4 \
            --url http://localhost:6006 \
            --index-json \
            --includeTags a11y-audit \
            --maxWorkers 2 \
            || (kill $SERVER_PID; exit 1)
          kill $SERVER_PID || true
