name: CI

# Substrate test gate. Runs the full pytest suite on every push to
# main and on every PR. Failure blocks the deploy webhook (when
# wired); for now the deploy stays manual but the gate exists.
#
# Why pytest only (not lint / typecheck / coverage gates): start
# with the test that catches regressions and add stricter checks
# when they pay for themselves. The substrate has 1414+ tests that
# meaningfully cover behavior; lint adds noise per change. Defer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # let the operator trigger from the Actions tab

concurrency:
  # One CI run per branch. New pushes cancel the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node 24 for JS-based actions (actions/checkout,
  # setup-node, setup-python). Node 20 was deprecated 2025-09-19;
  # forced removal 2026-09-16. This env var is GitHub's blessed
  # forward-compat path until each action's manifest is updated.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest-suite:
    name: pytest shard ${{ matrix.shard_index }} of 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -c tools/lints/constraints.txt \
            -e '.[dev,arxiv,pdf,urls,embedding,youtube,rss]'

      - name: Install local media runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe

      - name: Run pytest shard
        env:
          ANTIEK_PYTEST_SHARD_COUNT: "3"
          ANTIEK_PYTEST_SHARD_INDEX: ${{ matrix.shard_index }}
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          HERMES_API_KEY: ""
          XAI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTIEK_OPERATOR_TOKEN: ""
        run: |
          python -m pytest tests/ -q -m "not integration" \
            -p tools.pytest_file_shard

  pytest:
    name: pytest
    needs: pytest-suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The full tests/ gate runs in the three pytest-suite shards above. This job
    # retains the stable required-check name and runs the service suites plus
    # structural invariant gates only after all three shards pass.
    timeout-minutes: 20

    steps:
      - name: Require every pytest shard
        env:
          PYTEST_SUITE_RESULT: ${{ needs.pytest-suite.result }}
        run: test "$PYTEST_SUITE_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # We don't need history for the test run, but a depth of 1
          # means git log inside tests (none today, but defensive)
          # would fail. Default depth is fine.
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          # Pinned to 3.14 to match the operator's local development
          # environment AND the Python version that produces the
          # canonical Pydantic schema → TS types serialization.
          # Cross-version drift in model_json_schema() output had
          # CI flagging types.ts as stale even when committed types
          # were correct.
          python-version: '3.14'
          cache: 'pip'

      - name: Install Antiek + dev deps
        run: |
          python -m pip install --upgrade pip
          # The substrate uses sentence-transformers / pypdf etc.
          # in some test paths. Install with the extras the test
          # suite actually exercises — leave out ``interview``
          # because openai-whisper drags in 100+MB of torch state
          # that no current test depends on.
          # AGH SPR-04 (G4): pin the transitive set under the same lock the
          # enforce-declared-bar gate uses, so a floor-only pyproject bound
          # (all `>=`) can't let the resolver pull a breaking upgrade into a
          # green PR. Realized cost of NOT pinning: Starlette>=1.3 broke
          # test_krea_routes on every PR (the #81 fix). `-c` only pins a
          # package IF it installs, so macOS-frozen platform wheels are inert
          # on ubuntu.
          pip install -c tools/lints/constraints.txt \
            -e '.[dev,arxiv,pdf,urls,embedding,youtube,rss]'

      - name: Install local media runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe

      - name: Inline-rubric latency (craft signature — informational on CI)
        # Antiek's one craft signature per docs/craft_signature.md.
        # Compares p95 against benchmarks/baseline.json (locked
        # 2026-05-24 at 194.85us); exits 2 on >10% regression. Catches
        # the case where a substrate change silently slows the rubric
        # on the read path of every Phase 6 exit. Spec: SPR-E7.
        #
        # INFORMATIONAL on CI (does not block): this is a microsecond
        # benchmark, and a shared GitHub `ubuntu-latest` runner is ~2x slower
        # than the hardware the baseline was minted on, so it reports a false
        # +120% here. CLAUDE.md is explicit that re-minting is "operator-only;
        # do not run in CI" — so the authoritative enforcement is operator-side
        # where it is reliable. We still RUN it and surface the numbers as a
        # warning so a real regression is visible; we just don't fail the gate
        # on runner noise. (Re-minting to the runner's number would corrupt the
        # craft signature.)
        run: |
          python -m benchmarks.rubric_latency --check-regression \
            || echo "::warning title=Latency check is informational on CI::p95 over baseline on this shared runner; enforced operator-side per CLAUDE.md (microsecond benchmark, runner ~2x slower than baseline hardware)."

      - name: HTML-projection layer gates (HPRJ SPR-07 M4)
        # The projection / .antiek-format / ingestion layer's gates live under
        # services/, which the tests/ run above does NOT cover: zero-script gate
        # + palette purity + determinism (html_projection), signature coverage +
        # forbidden-fields + shell integrity (antiek_format), and island-only
        # ingest + foreign-HTML sanitizer quarantine (ingestion). Blocking.
        env:
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest services/html_projection/ services/antiek_format/ services/ingestion/ \
            -q -p no:cacheprovider

      - name: Substrate/dispatch boundary check
        # SPR-03 (DDIA-execution): forbid direct vendor-SDK imports
        # outside substrate/dispatch/providers/ and the explicit
        # allowlist. See docs/decisions/substrate_dispatch_boundary.md.
        # Sub-second on the full tree.
        run: |
          python tools/lint/boundary_check.py

      - name: One-owner-per-layer boundary check
        # SPR-03 (Antiek Flywheel Foundation). Sibling of the vendor-SDK
        # boundary_check.py above: vendor-check = "don't import the wrong
        # thing"; this owner-check = "don't reimplement the owned thing". An
        # AST scan that a shared CONCERN (the §9.0 servability predicate) is
        # DEFINED in exactly ONE module (substrate/books/servability.py) across
        # the five servability-consuming roots (graph/attribution/books/write/
        # speak); a SECOND module defining is_servable_full_text /
        # is_chunk_servable / servability_of is the §9.0 polarity-mismatch
        # owner-bypass this guard exists to prevent (the pre-SPR-08 chunk
        # denylist that diverged from the book allowlist). ENFORCING — no
        # `|| echo`/`|| true` swallow, so the step's pass/fail is EXACTLY the
        # lint's exit code; the prior foundation wired its equivalent guard
        # informational and so never caught the drift. Same path:line + exit-
        # code contract as boundary_check.py; sub-second on the full tree.
        # Registered as invariant `boundary` (substrate/invariants/boundary.toml,
        # guard_kind=script). See
        # docs/decisions/spr-09-boundary-lint-vs-import-linter.md (filename keeps
        # the artifact's 48c3856 provenance stem; the work lands under SPR-03).
        run: |
          python tools/lint/owner_boundary_check.py

      - name: Serve-guard boundary check
        # SPR-02 (arxiv-ingest): forbid direct serve_full_text() calls
        # outside the allowlist (substrate/books/serve.py where it is
        # defined, interfaces/research/api/serve_guard.py the guard, and
        # test files). Every full-body serve must route through
        # serve_full_text_guarded, which adds the independent license-tier
        # drift check defending against a T3 body leaving Antiek storage.
        # Models tools/lint/boundary_check.py (same path:line output, same
        # exit-code contract). Sub-second on the full tree.
        run: |
          python tools/lint/serve_guard_check.py

      - name: arXiv rate-governor egress check
        # SPR-09 M1: forbid a NEW direct arxiv.org HTTP egress outside the
        # governed seam (acquisition/arxiv/rate_governor.py). Every arXiv
        # request must route through the host-global flock'd governor so the
        # >=3s rate ceiling cannot be circumvented by a second concurrent job.
        # Models tools/lint/serve_guard_check.py (path:line, exit-code contract).
        run: |
          python tools/lint/rate_governor_check.py

      - name: arXiv serve-invariants check
        # SPR-09 M2: forbid a NEW SELECT/return of documents.raw_text (the
        # materialized body) outside the serve allowlist — closes the
        # "new endpoint reads raw_text directly, bypassing the tier gate"
        # T3-rehost path. Complements the serve_full_text bypass scanner.
        run: |
          python tools/lint/serve_invariants_check.py

      - name: Retrieval gate drift check
        # RG-04 + ASR SR-03: forbid RESTRICTED-only chunk-gate reimplementation
        # on the VSS substrate and GET /chunks — must delegate to retrieval_gate
        # helpers (non_privileged_chunk_sql_clause / is_chunk_body_withheld).
        # Catches VSS + HTTP regressions that omit personal_reading from the
        # non-privileged denylist.
        run: |
          python tools/lint/retrieval_gate_check.py

      - name: Owner-privilege boundary check
        # Activation SPR-owner-read: forbid a PRIVILEGED policy_tag literal
        # ("operator_only" / "private_research", or the _OWNER_READ_POLICY_TAG
        # constant) reaching search(...) / answer_book_question(...) outside the
        # auth-checked allowlist (interfaces/research/api/books.py, where the two
        # owner-read endpoints resolve the tag via _owner_read_policy_tag(request)).
        # A privileged tag is the §9.0 retrieval BYPASS — it admits the owner's
        # gated/personal corpus through the deny-by-default gate — so handing it in
        # as a bare literal at a non-allowlisted site (a careless new endpoint /
        # worker / script) would leak that corpus to an unauthenticated caller
        # (the Hachette/Bartz §9.0 leak; CLAUDE.md invariant #4). Sibling of
        # retrieval_gate_check.py: that one guards the gate SQL; this guards the
        # privileged-tag axis. Models tools/lint/serve_guard_check.py (same
        # path:line output, same exit-code contract). Sub-second on the full tree.
        run: |
          python tools/lint/owner_privilege_check.py

      - name: arXiv contact-guard check
        # SPR-09 M3: forbid a NEW provider.send( / OutboundEmail( site outside
        # the allowlist (operator magic-link auth.py + the deny-by-default
        # substrate/payouts/contact_guard.py). No outbound author email can be
        # added unguarded; with no SPR-07 claim flow, all author email is blocked.
        run: |
          python tools/lint/contact_guard_check.py

      - name: Merge-age gate (anti-stranding)
        # SPR-01 (Antiek Flywheel Foundation). Reds when the PR's base is more
        # than N=25 commits behind origin/main — the stale-base stranding that
        # killed the prior foundation (forked at 69bcfef, lapped ~+38 commits,
        # never merged). N=25 first reds at +26, inside a single sprint's normal
        # lifetime. Lives in the pytest job because that job checks out with
        # fetch-depth: 0, satisfying merge-age's full-history need. The step
        # self-gates its own exit code — no `|| echo` swallow — so the step's
        # pass/fail is EXACTLY the gate's exit code (a swallowed code would
        # re-create the silent-pass hole this gate closes). N is one named
        # constant (MAX_BEHIND); see docs/decisions/anti-stranding-gate.md.
        run: |
          python tools/lint/merge_age_gate.py

      - name: Reachability gate (anti-purgatory)
        # SPR-01 (Antiek Flywheel Foundation). Reds on a NEW zero-importer module
        # or a route with no inbound link — the "shipped into purgatory" failure
        # mode (promotes the statically-detectable core of reading_physics_check's
        # advisory PR-7 to enforcing; the product-judgment half stays advisory).
        # Grandfathers pre-existing cases via the shrink-only baseline at
        # tools/lints/baselines/reachability.json. Self-gates its own exit code —
        # no `|| echo` swallow. See docs/decisions/anti-stranding-gate.md.
        run: |
          python tools/lint/reachability_gate.py

      - name: Invariant-registry meta-check
        # SPR-02 (Antiek Flywheel Foundation) KEYSTONE. The registry under
        # substrate/invariants/ enumerates the load-bearing invariants; this
        # meta-check reds if any `guarded` declaration's guard is missing,
        # skipped, xfailed, xpassed, stubbed, or vacuous (the §14.4 fake-green
        # disease it exists to kill). Named here — not just swept into the
        # blanket pytest run — so a keystone failure is unmissable. Hermetic
        # in-process runner; no `|| echo` swallow. See substrate/invariants/ON-RAMP.md.
        run: |
          python -m pytest tests/test_invariant_registry_meta.py -q -p no:cacheprovider -p no:xdist

      # NOTE: the SPR-09 compounding-benchmark keystone moved to its OWN job
      # (``keystone`` below) — SPR-11. Running it as a tail step of ``pytest``,
      # after the full ~5400-test suite, OOM-killed it on the shared runner.
      # It now gets a fresh runner; the gate is unchanged (see that job).

      - name: Source-onboarding corpus-value gate
        # Reframe finding #2: the WIRED stop-rule replacing the spec's PROSE
        # "measure before build". Blocks onboarding any source AFTER arXiv whose
        # per-source corpus-value census (reports/source_census.json) falls below the
        # bar (metadata-completeness / link-back-resolvability / dedup-overlap). It is
        # a no-op (exit 0) until the P3b producer writes a census, and enforces the
        # moment one lands. Models tools/lint/serve_guard_check.py (exit-code contract).
        run: |
          python tools/lint/source_gate.py
      - name: Codegen staleness check
        # Catches the case where someone edits a Pydantic schema in
        # substrate/schemas/ without regenerating
        # apps/reading/src/generated/types.ts. The TS types are the
        # contract between substrate + web app; drift here causes
        # silent type lies at the JS boundary.
        run: |
          python tools/codegen/emit_types.py --stdout > /tmp/regen_types.ts
          if ! diff -q /tmp/regen_types.ts apps/reading/src/generated/types.ts; then
            echo "::error::Generated TS types are stale. Run:"
            echo "::error::  python tools/codegen/emit_types.py --stdout > apps/reading/src/generated/types.ts"
            diff /tmp/regen_types.ts apps/reading/src/generated/types.ts | head -30 || true
            exit 1
          fi
          echo "TS types in sync with Pydantic schemas."

      - name: Contract-conformance gate
        # antiek-unified SPR-08 M2/M4. The artifact that keeps "four
        # products are one product" true after the unified spec shipped.
        # FAILS the PR the moment a product forks a contract (drops/renames
        # a field that verify_conformance checks) OR the frozen DRW
        # sprint-lock drifts (a cited DRW sprint no longer resolves —
        # the seam-#6 silent-renumber risk). Both negatives are exercised
        # in tests/test_conformance_gate.py (an injected fork + an injected
        # renumber both fail). Runs as a standalone script so it also works
        # in pytest-free deploy/hook environments.
        # See docs/decisions/unified-integration-health.md.
        run: |
          python tools/codegen/check_conformance.py

  keystone:
    name: keystone
    runs-on: ubuntu-latest
    # SPR-11 (Antiek Flywheel Foundation): the SPR-09 compounding-benchmark
    # keystone runs in its OWN job, NOT as a tail step of `pytest`. Reason: the
    # benchmark spins multiple DuckDB graphs + asyncio researchers, and running
    # it AFTER the full ~5400-test suite on the same runner reliably OOM-killed
    # the step (null step-conclusion, no FAILED line, ~26-29 min into the job —
    # UNDER the 40-min timeout, so not a cancellation — while the identical run
    # passes 48/48 on a fresh machine, deterministic + tmp-isolated). A dedicated
    # fresh runner gives it full memory. This does NOT weaken the gate: the SAME
    # tests run, still fail on a real defect, and a keystone failure still reds
    # the PR — it just no longer competes for memory with the full suite.
    # Reconsider-if: the suite is sharded/xdist'd so the keystone can re-home
    # cheaply. See docs/decisions/ci-pytest-timeout.md.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install Antiek + dev deps
        run: |
          python -m pip install --upgrade pip
          # AGH SPR-04 (G4): pin the transitive set under the same lock the
          # enforce-declared-bar gate uses, so a floor-only pyproject bound
          # (all `>=`) can't let the resolver pull a breaking upgrade into a
          # green PR. Realized cost of NOT pinning: Starlette>=1.3 broke
          # test_krea_routes on every PR (the #81 fix). `-c` only pins a
          # package IF it installs, so macOS-frozen platform wheels are inert
          # on ubuntu.
          pip install -c tools/lints/constraints.txt \
            -e '.[dev,arxiv,pdf,urls,embedding,youtube,rss]'
      - name: Compounding benchmark (SPR-09 keystone)
        # The falsifiable compounding benchmark (compounding/benchmark/tests/).
        # `-m "not slow"` excludes the full n=20 multi-arm run. The seed-and-catch
        # tests (test_falsifiability) prove the scale reports a signed delta in
        # either direction and that the irrelevant-seed control can flag a run
        # invalid — a harness that could only ever return a positive delta would
        # red here. See compounding/benchmark/README.md.
        env:
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          HERMES_API_KEY: ""
          XAI_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest compounding/benchmark/tests/ -q -m "not slow" -p no:cacheprovider

  tsc:
    name: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install web app deps
        working-directory: apps/reading
        run: npm ci

      - name: Type-check
        working-directory: apps/reading
        run: npx tsc --noEmit

      - name: Token lint (pattern not tone — no new hardcoded hex)
        # frontend-design SPR-01 (harvested from PR #4). Fails the PR on any
        # NEW raw hex literal outside the token source files (tokens.ts /
        # tokens.css). Existing literals are grandfathered in
        # scripts/token_lint_baseline.json; the baseline only ever shrinks.
        # Turns "every colour is a token" from a review hope into a
        # mechanical guarantee. Re-mint deliberately with
        # `npm run lint:tokens:update`; never to silence a regression.
        working-directory: apps/reading
        run: npm run lint:tokens

      - name: Type-scale lint (24px chrome ceiling — no raw px above the scale)
        # CFEEL-S2 M2 (sibling of "Token lint" above). Fails the PR on any NEW
        # chrome font-size above PostHog's 24px app-type-scale ceiling, expressed
        # as the two scale-bypass escape hatches: a raw `font-size: NNpx` or a
        # Tailwind arbitrary `text-[NNpx]`. Named utilities (text-2xl …) are the
        # sanctioned scale and are not scanned. Reading-body CONTENT subtrees are
        # exempt (a book heading is content, not chrome). Existing violations are
        # grandfathered in scripts/type_scale_lint_baseline.json; the baseline
        # only ever shrinks. Re-mint deliberately with `npm run lint:type:update`;
        # never to silence a regression. See scripts/lint_type_scale.ts.
        working-directory: apps/reading
        run: npm run lint:type

      - name: Token parity (tokens.css ↔ tailwind.config.js)
        # CFEEL-FIX-1. Fails the PR if the sun accent (sun-deep / sun-glow) or
        # the *-night box-shadows drift between src/design/tokens.css (the
        # re-toned weathered source) and tailwind.config.js (the utilities ~45
        # components consume). lint:tokens above proves "no raw hex"; this proves
        # the tokens that DO exist still AGREE across the CSS-var and Tailwind
        # sides, so "lived feel" can never silently diverge from "designed feel".
        # Same guard the src/design/token-parity.test.ts vitest runs as a
        # subprocess — kept here too so the gate is enforced even if a vitest run
        # is skipped. See scripts/check_token_parity.ts for the parity rule.
        working-directory: apps/reading
        run: npm run check:tokens

      - name: Bundle budget (S12 WP-12.2)
        # `vite build` + scripts/check_bundle.ts. Fails the PR if the entry
        # `index` chunk (≤ 700 KB gz) or the `lemon` primitives chunk
        # (≤ 60 KB gz) exceeds its gzipped ceiling — the only two chunks
        # that ship on every page load. Catches a dependency or a fat
        # import silently ballooning the bundle.
        working-directory: apps/reading
        run: npm run build:check

      - name: Reading-physics augmentation boundary (SPR-03 — PR-1/2/3/6/8)
        # The Physics of Reading no-side-store / declare-don't-act guard.
        # Scans apps/reading/src/reading-physics/augmentations + facets and
        # fails on a private store, a DOM mutation, a sibling-augmentation
        # import, a substrate WRITE path, or (PR-8) an import outside the
        # augmentation allowlist. Models tools/lint/boundary_check.py (same
        # path:line output, same exit-code contract). Lives in the tsc job
        # because the augmentation surface is TypeScript (canon §7).
        #
        # The guard SELF-GATES its own exit code — no `|| echo` swallow here, so
        # the step's pass/fail is exactly the guard's exit code (no false-negative
        # trap). Blocking requires BOTH the canon front-matter `status: ratified`
        # AND `--enforce`; with either missing the guard exits 0 (advisory) even
        # when it lists findings, so this step stays GREEN while
        # docs/philosophy/physics-of-reading.md reads `status: draft`. The guard
        # itself prints the `[advisory]`/`ADVISORY` findings to the log.
        #
        # To flip blocking AFTER the operator ratifies the canon, the single
        # atomic act is: add `--enforce` to the command below. Because there is
        # no `|| echo` swallowing the exit code, that one edit is sufficient —
        # the gate will then fail (red) on a real violation under a ratified
        # canon. (Standing informational-then-blocking discipline,
        # docs/decisions/ci-informational-gates.md.) Run from the repo root
        # (the guard resolves its own paths).
        working-directory: ${{ github.workspace }}
        run: python3 tools/lint/reading_physics_check.py

  vitest:
    name: vitest
    # AGH SPR-04 (G1): the 158 apps/reading/src/**/*.test.ts(x) files (1319
    # tests) existed on main but NO workflow ran them — only scripts/
    # canonical_verify.sh ran the tiny vitest.agent.config.ts subset, so the
    # entire frontend behaviour suite could regress on a green PR. This job
    # runs `npm run test` (= `vitest run`, package.json) on every PR + push,
    # making that suite a real gate. Baseline at land time: 158 files / 1319
    # tests green locally. Blocking (no `|| echo` swallow) — a regression in
    # any of the 1319 now reds the PR, which is the whole point.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/reading/package-lock.json

      - name: Install web app deps
        working-directory: apps/reading
        run: npm ci

      - name: Vitest (frontend behaviour suite — 1319 tests)
        working-directory: apps/reading
        run: npm run test
