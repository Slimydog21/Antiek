# Dispatch router configuration.
#
# Routing decisions live here, not in code. Changes to which backend
# handles which role are a config edit, never a code edit.
#
# The "tier" abstraction maps to a concrete provider+model combination
# in the `tiers` section below. Roles reference tiers, not providers
# directly, so backend swaps (e.g., a new flash model) are one line.
#
# Pricing: USD per million tokens. **Operator owns these values.**
# Provider pricing pages change without notice; the numbers below are
# placeholders based on knowledge through January 2026 and MUST be
# verified before relying on any cost report. Set ``0.0`` to disable
# cost tracking for a tier.

version: 0.1.0

# ---------------------------------------------------------------------------
# Tier definitions.
# ---------------------------------------------------------------------------
tiers:
  # ── ARCHITECTURAL POSTURE (operator decision 2026-07-06): ──
  # CLAUDE-LESS FOOTPRINT. Every tier's primary is GLM-5.2 (Zhipu z.ai,
  # DIRECT API). The two cross-family backups are DeepSeek V4 Pro and
  # Xiaomi MiMo V2.5 Pro — both via their DIRECT APIs, no OpenRouter hop —
  # chained three-deep as GLM → DeepSeek → MiMo so a single provider or
  # model outage never bricks a tier. OpenRouter and Anthropic are removed
  # from the routing entirely; all inference runs through three direct
  # endpoints (z.ai / api.deepseek.com / api.mimo.xiaomi.com).
  #
  # THINKING POLICY (per-tier): flash/pro/verify run GLM-5.2 with
  # thinking=disabled (the `zai` provider) — the volume thesis, direct
  # crystallized answers at high throughput. synthesis runs GLM-5.2 with
  # thinking ENABLED (the `zai_reasoning` provider) — synthesis is the
  # human-facing long-form artifact where reasoning demonstrably matters,
  # so it keeps GLM-5.2's native chain-of-thought. This preserves the
  # quality rationale the old Opus-primary config existed for WITHOUT the
  # Claude dependency. (GLM-5.2 reasons by default; #213 disabled it for
  # the high-volume tiers.)
  #
  # CROSS-FAMILY MODEL INVARIANT (load-bearing): every ADJACENT link in a
  # tier's fallback chain is a DIFFERENT MODEL FAMILY. GLM → DeepSeek →
  # MiMo has no two adjacent same-family links, so a single model-scoped
  # event (rate-limit / deprecation / outage) never takes two layers at
  # once. Enforced by test_fallback_is_a_different_model_family, which now
  # walks the whole chain, not just one link.
  #
  # Model ids are per-call args (one endpoint serves several models):
  # glm-5.2, deepseek-v4-pro, mimo-v2.5-pro. If the operator's z.ai-served
  # model id changes (e.g. glm-5.5), update the model values below — no
  # code change needed.

  flash:
    # Bulk, cost-optimized. Note-taking, page-level ingestion,
    # extraction, grounder, constraint_checker.
    #
    # PRIMARY = GLM-5.2 (operator decision 2026-07-06: GLM-5.2 is the
    # platform's AI driver). The zai provider runs it with
    # thinking=disabled (see bootstrap.py:_maybe_zai) so high-volume
    # note-taking gets direct crystallized answers, not reasoning traces.
    # This replaced the prior deepseek-v4-flash primary, which bailed
    # with {"notes": []} on distillable prose.
    provider: zai
    model: glm-5.2
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: deepseek
      model: deepseek-v4-pro
      fallback:
        provider: xiaomi
        model: mimo-v2.5-pro

  pro:
    # Reasoning-heavy primary work (decomposer, connector, user_agent,
    # challenger). GLM-5.2 (zai, thinking-disabled for direct answers).
    # Enabling thinking for genuinely reasoning-heavy roles is a
    # one-line extra_body change in bootstrap.py:_maybe_zai.
    provider: zai
    model: glm-5.2
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: deepseek
      model: deepseek-v4-pro
      fallback:
        provider: xiaomi
        model: mimo-v2.5-pro

  synthesis:
    # Synthesizer role — the human-facing artifact.
    #
    # CLAUDE-LESS (operator directive 2026-07-06): synthesis primary is
    # GLM-5.2 via the `zai_reasoning` provider (thinking ENABLED — GLM's
    # native chain-of-thought), NOT Opus. The old Opus-4.7 primary + the
    # Sprint 17→20 measurement window are retired: the operator's model
    # footprint is now claude-less. GLM-5.2-with-thinking is the reasoned
    # replacement for the reasoning model synthesis used to run on, so the
    # "right denominator is cost-per-acceptable-synthesis" rationale is
    # preserved without the Anthropic dependency. (If GLM-thinking synthesis
    # quality underperforms Opus in a future measurement, the revert is one
    # config line back to an Anthropic tier — not a code change. The
    # claude-less directive is the operator's explicit call as of this date.)
    provider: zai_reasoning
    model: glm-5.2
    pricing:
      # GLM-5.2 direct (z.ai). Operator-owns-these-values per the header:
      # set 0.0 until z.ai per-token pricing is verified for cost reports.
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: deepseek
      model: deepseek-v4-pro
      fallback:
        provider: xiaomi
        model: mimo-v2.5-pro

  verify:
    # Cross-family verification. GLM-5.2 (zai, thinking-disabled).
    provider: zai
    model: glm-5.2
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    # Verifier MUST have a multi-layer fallback. Without one, a provider
    # outage bricks every verifier call (the role most directly responsible
    # for catching substrate quality regressions). Architectural invariant
    # — see tests/test_dispatch_fallback_chain.py.
    fallback:
      provider: deepseek
      model: deepseek-v4-pro
      fallback:
        provider: xiaomi
        model: mimo-v2.5-pro

  transcription:
    # Sprint 13 — voice note ingestion. Whisper-grade audio→text.
    # Routes through OpenAI's whisper-1 directly (no good Hermes
    # transcription path today). $0.006/minute of audio is the
    # canonical pricing; substrate.dispatch.whisper.WhisperProvider
    # implements the actual call.
    provider: openai
    model: whisper-1
    pricing:
      # Whisper is per-minute, not per-token. The cost helper in
      # ``processing.transcription`` computes USD from audio duration
      # and reports it via ``dispatch.call`` events as if it were
      # output tokens (1 minute = 1000 "output_tokens" placeholder).
      input_per_mtok: 0.0
      output_per_mtok: 6.0  # 1 mtok placeholder ≈ 1000 minutes
      cached_input_per_mtok: 0.0

  tts:
    # Sprint 17 — interview voice mode. Routes AI-interviewer responses
    # to OpenAI TTS for the informant-facing audio. ~$15 per 1M
    # characters (gpt-4o-mini-tts pricing as of 2026-05).
    # ElevenLabs is the alternative for higher voice quality at higher
    # cost — feature-flagged via ANTIEK_TTS_PROVIDER once that adapter
    # ships. Async voice loop with 3-5s round-trip latency per
    # master-spec §11.5; synchronous voice (OpenAI Realtime API)
    # deferred to Sprint 23+ per §15.3.
    provider: openai
    model: gpt-4o-mini-tts
    pricing:
      input_per_mtok: 15.0  # per million characters; substrate accounts as input
      output_per_mtok: 0.0  # TTS has no token output; audio is the output
      cached_input_per_mtok: 0.0

  local:
    # Deferred. The abstraction is here so adding a backend later is
    # one new entry; calling code unchanged.
    provider: null
    model: null

# ---------------------------------------------------------------------------
# Role → tier mapping. Defaults match substrate/constants.py:DEFAULT_ROLE_TIER.
# Override here without touching code.
# ---------------------------------------------------------------------------
role_tiers:
  decomposer: pro
  evidence_retriever: flash
  parameter_extractor: flash
  connector: pro
  synthesizer: synthesis
  user_agent: pro
  note_taker: flash
  challenger: pro
  grounder: flash
  tier_assigner: flash
  constraint_checker: flash
  verifier: verify
  # Phase 8 knowledge extraction. ``skills/domain/extract.py``
  # dispatches with role="knowledge_extractor"; without this entry,
  # the call raised ``KeyError("Role 'knowledge_extractor' not in
  # config.role_tiers")``, every Phase 8 run produced an empty
  # ``auto_patch_applied`` event with ``patched=[]``, and the Phase 8
  # postcondition then failed the whole investigation. Test fixtures
  # at tests/test_loop_one_orchestrator.py:176 had this routed to
  # ``pro``; matching production. Fixed 2026-05-18.
  knowledge_extractor: pro
  # AGH SPR-01: same production-only routing gap as the knowledge_extractor
  # precedent above. The endpoint dispatches role="thought_partner"; the role
  # tier entry alone is the established fix, with no constants.py change.
  thought_partner: pro
  # WV (writing vertical): same production-only routing gap as the
  # knowledge_extractor / thought_partner precedents above.
  # substrate/write/draft_generation.default_dispatch_fn dispatches
  # role="creative_writer"; without this entry the router raised
  # KeyError("Role 'creative_writer' not in config.role_tiers") and
  # POST /write/sections/{id}/generate 503'd on every call — the whole
  # writing-generate path was dead (GAP-ANALYSIS.md §1's "creative_writer
  # WIRED" was stale on origin/main, true only on the closed-unmerged
  # reader/integration). The role tier entry alone is the established
  # fix, no constants.py change (per the thought_partner precedent).
  # Tier=pro (grok-4.3, precedent-matched + cost-bounded); the operator
  # can bump to 'synthesis' if deliverable prose quality demands it.
  # The route is operator-auth-gated (global middleware), so this
  # enables the operator-only generate path, not a public endpoint.
  creative_writer: pro
  # CK-3 (cursor-for-knowledge): inline autocomplete — the signature
  # Cursor writing-flow affordance. Flash tier (GLM-5.2, thinking disabled)
  # for fast, direct completions at high volume. Same one-line-routing
  # precedent as knowledge_extractor / thought_partner / creative_writer.
  autocomplete: flash
  # LINEUP-CATALOG-TRUTH (2026-08-13): the Speak vertical's interviewer
  # (async_interview + orchestrator) dispatches role="interviewer" but had
  # NO role_tiers entry — every follow-up/interview question through the
  # production dispatch adapter raised KeyError (uncaught in
  # substrate/speak/async_interview.py). Same one-line-routing precedent as
  # knowledge_extractor / thought_partner / creative_writer / autocomplete.
  # Tier=pro (conversational question generation, precedent-matched).
  interviewer: pro

# ---------------------------------------------------------------------------
# Per-tier defaults. Roles can override at call time, but these are
# the sane starting points.
# ---------------------------------------------------------------------------
tier_defaults:
  flash:
    max_tokens: 4096
    temperature: 0.2
    context_budget_tokens: 32000
  pro:
    max_tokens: 8192
    temperature: 0.3
    context_budget_tokens: 64000
  synthesis:
    max_tokens: 16384
    temperature: 0.4
    context_budget_tokens: 256000
  verify:
    max_tokens: 4096
    temperature: 0.1
    context_budget_tokens: 32000
  transcription:
    # Whisper has no tokens / temperature; these are placeholders so
    # the schema validator does not need a transcription-specific
    # branch.
    max_tokens: 0
    temperature: 0.0
    context_budget_tokens: 0
  tts:
    # TTS has no tokens / temperature; same placeholder pattern.
    max_tokens: 0
    temperature: 0.0
    context_budget_tokens: 0

# ---------------------------------------------------------------------------
# Cost tracking. The router records per-role and per-investigation
# cost into the event log. Pricing values above are the source of truth.
# ---------------------------------------------------------------------------
cost_tracking:
  enabled: true
  emit_event_per_call: true
