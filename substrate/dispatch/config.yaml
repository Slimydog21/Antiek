# Dispatch router configuration.
#
# Routing decisions live here, not in code. Changes to which backend
# handles which role are a config edit, never a code edit.
#
# The "tier" abstraction maps to a concrete provider+model combination
# in the `tiers` section below. Roles reference tiers, not providers
# directly, so backend swaps (e.g., a new flash model) are one line.
#
# Pricing: USD per million tokens. **Operator owns these values.**
# Provider pricing pages change without notice; the numbers below are
# placeholders based on knowledge through January 2026 and MUST be
# verified before relying on any cost report. Set ``0.0`` to disable
# cost tracking for a tier.

version: 0.1.0

# ---------------------------------------------------------------------------
# Tier definitions.
# ---------------------------------------------------------------------------
tiers:
  # ── ARCHITECTURAL POSTURE (operator decision 2026-05-18): ──
  # All tiers route through Hermes/Grok primary with OpenRouter
  # (DeepSeek + Claude) as fallback. The thesis: substrate quality
  # emerges from VOLUME of dispatches (recursive note-taking +
  # compounding graph), not from per-call model quality. SuperGrok's
  # Hermes Agent OAuth bridge sanctions third-party API usage against
  # the operator's subscription quota — using it for non-synthesis
  # roles captures already-paid-for inference at zero marginal cost.
  # Fallback to OpenRouter preserves substrate liveness when Hermes
  # quota runs out or the agent is unreachable.
  #
  # If the operator's Hermes-served Grok model id is different from
  # 'grok-4.3' (e.g. 'grok-4', 'grok-4.3-heavy'), update the model
  # values below — no code change needed.

  flash:
    # Bulk, cost-optimized. Note-taking, page-level ingestion,
    # extraction, grounder, constraint_checker.
    provider: hermes
    model: grok-4.3
    pricing:
      # Subscription-attributed cost; per-call billed = $0.0.
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: openrouter
      model: deepseek/deepseek-v4-flash

  pro:
    # Reasoning-heavy primary work (decomposer, connector, user_agent,
    # challenger).
    provider: hermes
    model: grok-4.3
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: openrouter
      model: deepseek/deepseek-v4-pro

  synthesis:
    # Synthesizer — human-facing artifact. Base tier (no engagement override):
    # still Opus for legacy / explicit non-interactive paths that do not set
    # autonomous overrides. **Interactive** sessions remap synthesizer → ``speed``
    # (TileRT GLM-5.2) via engagement_policy (operator 2026-06-23). **Autonomous**
    # sessions use ``research_synthesis`` (Kimi / DeepSeek throughput).
    # Falsifier: if verifier pass rate on GLM synthesis drops >5pp vs Opus baseline,
    # revert interactive synthesizer override in engagement_policy only.
    provider: openrouter
    model: anthropic/claude-opus-4.7
    pricing:
      input_per_mtok: 5.0
      output_per_mtok: 25.0
      cached_input_per_mtok: 0.50  # 90% Anthropic prompt-caching discount
    fallback:
      provider: hermes
      model: grok-4.3

  verify:
    # Cross-family verification. Same Hermes/Grok path.
    provider: hermes
    model: grok-4.3
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    # Verifier MUST have a fallback. Without one, a bridge outage
    # bricks every verifier call (the role most directly responsible
    # for catching substrate quality regressions). Architectural
    # invariant — see tests/test_dispatch_fallback_chain.py.
    fallback:
      provider: openrouter
      model: deepseek/deepseek-v4-pro

  transcription:
    # Sprint 13 — voice note ingestion. Whisper-grade audio→text.
    # Routes through OpenAI's whisper-1 directly (no good Hermes
    # transcription path today). $0.006/minute of audio is the
    # canonical pricing; substrate.dispatch.whisper.WhisperProvider
    # implements the actual call.
    provider: openai
    model: whisper-1
    pricing:
      # Whisper is per-minute, not per-token. The cost helper in
      # ``processing.transcription`` computes USD from audio duration
      # and reports it via ``dispatch.call`` events as if it were
      # output tokens (1 minute = 1000 "output_tokens" placeholder).
      input_per_mtok: 0.0
      output_per_mtok: 6.0  # 1 mtok placeholder ≈ 1000 minutes
      cached_input_per_mtok: 0.0

  tts:
    # Sprint 17 — interview voice mode. Routes AI-interviewer responses
    # to OpenAI TTS for the informant-facing audio. ~$15 per 1M
    # characters (gpt-4o-mini-tts pricing as of 2026-05).
    # ElevenLabs is the alternative for higher voice quality at higher
    # cost — feature-flagged via ANTIEK_TTS_PROVIDER once that adapter
    # ships. Async voice loop with 3-5s round-trip latency per
    # master-spec §11.5; synchronous voice (OpenAI Realtime API)
    # deferred to Sprint 23+ per §15.3.
    provider: openai
    model: gpt-4o-mini-tts
    pricing:
      input_per_mtok: 15.0  # per million characters; substrate accounts as input
      output_per_mtok: 0.0  # TTS has no token output; audio is the output
      cached_input_per_mtok: 0.0

  local:
    # Deferred. The abstraction is here so adding a backend later is
    # one new entry; calling code unchanged.
    provider: null
    model: null

  speed:
    # TileRT GLM-5.2-FP8 on Modal (HF zai-org/GLM-5.2-FP8; infrastructure/modal/tilert_glm5). Latency-first
    # tier for interactive sessions (engagement_policy.interactive). Operator 2026-06-23:
    # GLM-5.2 via TileRT is the driving model when the user is in-product; replaces
    # Opus/Hermes for engaged driving roles. Set ANTIEK_TILERT_API_KEY +
    # ANTIEK_TILERT_BASE_URL on the gateway host.
    provider: tilert
    model: glm5
    pricing:
      # Modal B200:8 — set from observed $/hr and measured tok/s; placeholder 0
      # until operator calibrates (see DESIGN.md).
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: xiaomi
      model: mimo-v2.5-pro

  research_flash:
    # Autonomous throughput — bulk graph irrigation (flash roles).
    provider: xiaomi
    model: mimo-v2.5-flash
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: deepseek
      model: deepseek-v4-flash

  research_pro:
    # Autonomous throughput — reasoning / connector / challenger paths.
    provider: deepseek
    model: deepseek-v4-pro
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: xiaomi
      model: mimo-v2.5-pro

  research_synthesis:
    # Autonomous throughput — long-form deliverables off-product. Kimi via OpenRouter
    # until a first-class ``kimi`` provider ships in bootstrap.py.
    provider: openrouter
    model: moonshotai/kimi-k2.5
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      cached_input_per_mtok: 0.0
    fallback:
      provider: deepseek
      model: deepseek-v4-pro

  ceo:
    # Future: Fable / Mythos brain tier (NotDiamond-orchestrated CEO). No provider
    # today — placeholder so config can reference ``ceo`` without code edits.
    provider: null
    model: null

# ---------------------------------------------------------------------------
# Engagement vs autonomous routing (operator 2026-06-23).
# Interactive → TileRT ``speed`` for driving roles. Autonomous → research_* APIs.
# Callers pass ``latency_mode=`` on dispatch(); gateway may set ANTIEK_LATENCY_MODE.
# ---------------------------------------------------------------------------
engagement_policy:
  # Default platform brain is ``glm`` (brain_choice.py). Users opt into
  # ``premium`` at research start for Opus/pro driving tiers.
  default_mode: autonomous
  interactive:
    role_tier_overrides:
      decomposer: speed
      connector: speed
      challenger: speed
      user_agent: speed
      synthesizer: speed
      knowledge_extractor: speed
  autonomous:
    role_tier_overrides:
      note_taker: research_flash
      evidence_retriever: research_flash
      parameter_extractor: research_flash
      grounder: research_flash
      tier_assigner: research_flash
      constraint_checker: research_flash
      decomposer: research_pro
      connector: research_pro
      challenger: research_pro
      user_agent: research_pro
      knowledge_extractor: research_pro
      synthesizer: research_synthesis

# ---------------------------------------------------------------------------
# Role → tier mapping. Defaults match substrate/constants.py:DEFAULT_ROLE_TIER.
# Override here without touching code.
# ---------------------------------------------------------------------------
role_tiers:
  decomposer: pro
  evidence_retriever: flash
  parameter_extractor: flash
  connector: pro
  synthesizer: synthesis
  user_agent: pro
  note_taker: flash
  challenger: pro
  grounder: flash
  tier_assigner: flash
  constraint_checker: flash
  verifier: verify
  # Phase 8 knowledge extraction. ``skills/domain/extract.py``
  # dispatches with role="knowledge_extractor"; without this entry,
  # the call raised ``KeyError("Role 'knowledge_extractor' not in
  # config.role_tiers")``, every Phase 8 run produced an empty
  # ``auto_patch_applied`` event with ``patched=[]``, and the Phase 8
  # postcondition then failed the whole investigation. Test fixtures
  # at tests/test_loop_one_orchestrator.py:176 had this routed to
  # ``pro``; matching production. Fixed 2026-05-18.
  knowledge_extractor: pro

# ---------------------------------------------------------------------------
# Per-tier defaults. Roles can override at call time, but these are
# the sane starting points.
# ---------------------------------------------------------------------------
tier_defaults:
  flash:
    max_tokens: 4096
    temperature: 0.2
    context_budget_tokens: 32000
  pro:
    max_tokens: 8192
    temperature: 0.3
    context_budget_tokens: 64000
  synthesis:
    max_tokens: 16384
    temperature: 0.4
    context_budget_tokens: 256000
  verify:
    max_tokens: 4096
    temperature: 0.1
    context_budget_tokens: 32000
  transcription:
    # Whisper has no tokens / temperature; these are placeholders so
    # the schema validator does not need a transcription-specific
    # branch.
    max_tokens: 0
    temperature: 0.0
    context_budget_tokens: 0
  tts:
    # TTS has no tokens / temperature; same placeholder pattern.
    max_tokens: 0
    temperature: 0.0
    context_budget_tokens: 0
  speed:
    max_tokens: 8192
    temperature: 0.3
    context_budget_tokens: 128000
  research_flash:
    max_tokens: 4096
    temperature: 0.2
    context_budget_tokens: 32000
  research_pro:
    max_tokens: 8192
    temperature: 0.3
    context_budget_tokens: 64000
  research_synthesis:
    max_tokens: 16384
    temperature: 0.4
    context_budget_tokens: 256000

# ---------------------------------------------------------------------------
# Cost tracking. The router records per-role and per-investigation
# cost into the event log. Pricing values above are the source of truth.
# ---------------------------------------------------------------------------
cost_tracking:
  enabled: true
  emit_event_per_call: true
