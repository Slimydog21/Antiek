codebase asserts but does not yet *mechanically* guard (tests/test_seam_voice_
single_owner.py guards single-OWNERSHIP of the voice pipeline, NOT the style
discipline itself). No sprint in this spec owns a §5-style guard; flag for the
operator to decide whether/how a non-vacuous guard is even feasible (this may be
an inherently human-judged invariant — see operator ratification items).
"""
assertion = "UNOWNED: whether §5 voice/style is mechanically guardable at all is an open operator question; until then it is an honest gap, NOT silently omitted."
