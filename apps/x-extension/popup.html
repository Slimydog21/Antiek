<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Antiek X Capture</title>
    <style>
      :root {
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: #292524;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: #fafaf9;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        color: #57534e;
      }
      input,
      select {
        width: 100%;
        padding: 6px 8px;
        margin-top: 4px;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        font-size: 12px;
        background: white;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
        width: 100%;
        background: #1c1917;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #a8a29e;
        cursor: not-allowed;
      }
      .row {
        margin-top: 10px;
        padding: 8px;
        border-radius: 4px;
        font-size: 11px;
      }
      .row.ok {
        background: #ecfdf5;
        color: #047857;
      }
      .row.err {
        background: #fef2f2;
        color: #b91c1c;
      }
      .row.info {
        background: #f5f5f4;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <h1>Capture thread → Antiek</h1>

    <label
      >API endpoint
      <input
        id="api-url"
        type="url"
        placeholder="https://api.antiek.ai"
      />
    </label>

    <label
      >Investigation id
      <input id="inv-id" type="text" placeholder="__operator__" />
    </label>

    <button id="capture">Capture this thread</button>

    <div id="status" class="row info">
      Open a tweet (URL contains <code>/status/</code>) and press the button.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
