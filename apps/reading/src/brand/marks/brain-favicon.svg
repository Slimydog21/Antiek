<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Antiek">
  <!-- The brain on a sun-yellow square — the brand mark at favicon
       fidelity. Geometry follows BrainMark (the rail mark) scaled to the
       64-unit viewBox; mark fidelity only (no thin fold strokes — they
       alias at 16px). One yellow only (--sun #F5DF24); the ink brain on
       sun follows the penguin favicon's palette discipline. -->
  <rect width="64" height="64" rx="12" fill="#F5DF24"/>
  <!-- Brain — two hemispheres, one silhouette. -->
  <path
    d="M32 9.5 C 24.2 7, 13.6 12.4, 16 23.4 C 17.6 30.6, 21.9 34.8, 25 39.8 C 26.8 42.9, 29.2 46.3, 32 45.6 C 34.8 46.3, 37.2 42.9, 39 39.8 C 42.1 34.8, 46.4 30.6, 48 23.4 C 50.4 12.4, 39.8 7, 32 9.5 Z"
    fill="#0F1419"
  />
  <!-- Central cleft — sun stroke separates the hemispheres. -->
  <path
    d="M32 12 C 29.8 20, 34.2 28, 32 42.5"
    stroke="#F5DF24"
    stroke-width="2.4"
    fill="none"
    stroke-linecap="round"
  />
</svg>
