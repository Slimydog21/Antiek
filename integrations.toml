# Antiek external-integration registry.
#
# One table per vendor or external dependency that crosses Antiek's
# boundary. Hashimoto's "default-deny / vouching" lens encoded as
# config: every integration carries a tier, a voucher, and (for
# Tier 2) a sunset_date. The CI gate at scripts/check_integration_tiers.py
# walks the codebase and asserts the imports match the declared tiers.
#
# Tier ladder:
#
#   0 — spec only. Documented in docs/integration_<vendor>.md; no
#       code may import the package. Catches drift between docs and
#       reality (a "we'll get to it" integration silently sprouting
#       a call site).
#   1 — local prototype. Imports allowed under experiments/, scripts/spike_*,
#       or tools/ but not under substrate/, acquisition/, middleware/,
#       interfaces/, orchestration/, compounding/, processing/. Adoption
#       to Tier 2 requires the operator to add the file path to
#       prod_call_sites and set sunset_date.
#   2 — prod call-site with sunset. Every import site must appear in
#       prod_call_sites. sunset_date is the operator's commitment to
#       either promote (Tier 3) or remove the integration by that date.
#       Default sunset window: 90 days from vouched_at.
#   3 — adopted indefinitely. Vouched-by operator; appears in the
#       PROD_VENDORS frozenset in substrate/integrations.py. No sunset.
#
# Adding a new integration: append a [<vendor>] table here, fill all
# required fields, and either (a) ensure the imports match the tier,
# or (b) register an inline ``# tier-allow: <reason>`` exception that
# the CI script will log to tier_overrides.log.
#
# Spec: ~/specs/antiek-hashimoto-engineering/sprint-e3-vouching.html
# Round-1 philosophy: ~/specs/antiek-philosophy/rounds/round-01-hashimoto/sprint-04-vouching.html


