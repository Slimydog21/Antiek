[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antiek"
version = "0.0.1"
description = "Research substrate consolidating Researchmaxx and DeepBlu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Faisal", email = "ftn208@nyu.edu" },
]

# Core runtime dependencies. Keep this list tight; add only what every
# surface needs. Surface-specific deps belong in optional-dependencies below.
dependencies = [
  "duckdb>=1.1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "orjson>=3.10",
]

[project.optional-dependencies]
# Acquisition-path-specific dependencies. Pull these in only where needed.
arxiv = ["arxiv>=2.1"]
pdf = ["pypdf>=4.3", "pdfplumber>=0.11"]
urls = ["html2text>=2024.2", "beautifulsoup4>=4.12"]
embedding = ["sentence-transformers>=3.0", "numpy>=1.26"]
interview = ["openai-whisper>=20240930"]  # for ASR, swap for API client when wired
youtube = ["yt-dlp>=2024.8.6", "youtube-transcript-api>=0.6"]
rss = ["feedparser>=6.0"]

# Dev / test
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-python-dateutil",
]

[project.scripts]
# Entry point lives at `antiek.cli:main` once we wire it. For now this is
# a placeholder so `pip install -e .` doesn't fail; the real launcher
# fires up Hermes with the right profile (see spec, "Compute and runtime").
antiek = "antiek.cli:main"

[tool.hatch.build.targets.wheel]
# Each top-level directory in the spec is a separate Python package. We
# tell hatchling about each one explicitly so it doesn't try to guess.
packages = [
  "substrate",
  "skills",
  "acquisition",
  "processing",
  "roles",
  "middleware",
  "orchestration",
  "interfaces",
  "compounding",
  "runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
