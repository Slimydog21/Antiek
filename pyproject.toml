[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antiek"
version = "0.0.1"
description = "Research substrate consolidating Researchmaxx and DeepBlu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Faisal", email = "ftn208@nyu.edu" },
]

# Core runtime dependencies. Keep this list tight; add only what every
# surface needs. Surface-specific deps belong in optional-dependencies below.
dependencies = [
  "duckdb>=1.1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "orjson>=3.10",
  # SPR-01 public-domain connector imports `requests` at module top level and
  # lazily imports `reportlab` for the Gutenberg text→PDF bridge. Both were
  # previously only transitively present; declared here as core so the
  # acquisition/books path imports cleanly (the corpus-ingest orchestrator
  # exercises the Gutenberg path). Not a new heavy dep — both are existing
  # imports being made explicit.
  "requests>=2.31",
  "reportlab>=4.0",
  # SPR-08 BYOK credential store: runtime/byok/store.py uses
  # libsodium SecretBox (XSalsa20-Poly1305) to encrypt the operator's own X
  # API key at rest. Declared CORE (not optional) because runtime/byok/
  # __init__.py imports store.py unconditionally, so any `import runtime.byok`
  # pulls nacl — leaving it undeclared makes the whole BYOK path (and its
  # gate tests) uncollectable on a clean venv. Dependency-light, in-process,
  # no OS keyring daemon: see runtime/byok/store.py docstring for the
  # mechanism rationale on this headless single-writer host.
  "pynacl>=1.5",
]

[project.optional-dependencies]
# Acquisition-path-specific dependencies. Pull these in only where needed.
arxiv = ["arxiv>=2.1"]
pdf = ["pypdf>=4.3", "pdfplumber>=0.11"]
# Document-model extraction (Reader SPR-02). markdown-it-py is the CommonMark
# reference port used by processing/extraction/to_document_model.py to turn
# stored markdown/text into the SPR-01 typed-block Document; mdit-py-plugins
# supplies the dollar-math plugin ($..$ inline / $$..$$ display → MathSpan /
# MathBlock). Lazy-imported there (loud ImportError with install hint) so the
# rest of the substrate does not pay for the parser. Justified against the
# repo's no-new-deps lean in the module docstring: the stored corpus is real
# CommonMark (html2text output), too varied for a stdlib regex parser.
extraction = ["markdown-it-py>=3.0", "mdit-py-plugins>=0.4"]
urls = ["html2text>=2024.2", "beautifulsoup4>=4.12"]
embedding = ["sentence-transformers>=3.0", "numpy>=1.26"]
interview = ["openai-whisper>=20240930"]  # for ASR, swap for API client when wired
youtube = ["yt-dlp>=2024.8.6", "youtube-transcript-api>=0.6"]
rss = ["feedparser>=6.0"]
# Browserbase escalation — Wedge 2 of the Exa & Browserbase integration
# spec. Optional per spec §14.4: pinned here so the operator installs the
# SDKs only when actually enabling fallback_to_browserbase=True. Lazy
# imports inside acquisition/urls/client_browserbase.py raise
# BrowserbaseUnavailable when the SDK is missing — loud failure rather
# than silent degradation.
browserbase = [
  "browserbase>=0.4",
  "playwright>=1.45",
]
# Remote-exec research fan-out — unified SPR-02, behind the §16
# research-fan-out exemption (docs/decisions/s16-research-fanout-exemption.md).
# Optional and lazy by the same discipline as [browserbase]: pinned here so
# the operator installs the SDK only when actually enabling remote-exec
# (ANTIEK_REMOTE_EXEC_ENABLED=1). The lazy import inside
# runtime/remote_exec/daytona.py raises RemoteExecUnavailable when the SDK is
# missing and remote-exec is enabled — loud failure, never silent fallback to
# host-local that hides the misconfiguration. (Host-local IS the sanctioned
# fallback, but only via the explicit factory decision, not a swallowed
# ImportError.)
remote_exec = [
  "daytona-sdk>=0.10",
]
# Deliverable export — Sprint 15 §3.4 "PDF, EPUB, Substack" formats.
# Lazy-imported in the export endpoint; missing deps return a 503 with
# install hint rather than crashing on import. xhtml2pdf is pure-Python
# (pulls reportlab); ebooklib is small.
export = [
  "xhtml2pdf>=0.2.13",
  "ebooklib>=0.18",
]

# Dev / test
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  # ``pytest-xdist`` provides the ``-n`` parallel-worker flag. The default
  # ``addopts`` (``-ra --strict-markers`` in [tool.pytest.ini_options]) does
  # NOT pass ``-n``, so it is no longer load-bearing for the default run; it
  # is kept so an operator/CI invocation can opt into ``-n auto`` parallelism
  # without re-installing. (H5, 2026-05-18, originally added it when addopts
  # DID carry ``-n auto``.)
  "pytest-xdist>=3.6",
  # SPR-04's attribution golden/property suite (tests/test_attribution_golden.py)
  # hard-imports `hypothesis` for its property tests. It was present in the
  # operator venv (transitively) but undeclared, so a clean CI checkout aborted
  # at COLLECTION ("No module named 'hypothesis'") before any test ran — masking
  # the rest of the suite. Declared here so the property tests actually run on CI
  # (declaring keeps the gate; importorskip would silently disable it).
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-python-dateutil",
]
# NOTE on export extras: xhtml2pdf pulls reportlab → pycairo which needs
# system libcairo2-dev. We deliberately do NOT include xhtml2pdf or
# ebooklib in [dev] so default CI installs don't require apt-getting
# system libraries. The PDF + EPUB tests skipif-import the libs and
# skip cleanly when not installed; the Substack test passes without
# them (pure-stdlib markdown emission). Operators who want server-side
# PDF/EPUB rendering install via ``pip install -e '.[export]'`` plus
# the matching system libs. Substack export works without the extra.

[project.scripts]
# Entry point lives at `antiek.cli:main` once we wire it. For now this is
# a placeholder so `pip install -e .` doesn't fail; the real launcher
# fires up Hermes with the right profile (see spec, "Compute and runtime").
antiek = "antiek.cli:main"

[tool.hatch.build.targets.wheel]
# Each top-level directory in the spec is a separate Python package. We
# tell hatchling about each one explicitly so it doesn't try to guess.
packages = [
  "substrate",
  "skills",
  "acquisition",
  "processing",
  "roles",
  "middleware",
  "orchestration",
  "interfaces",
  "compounding",
  "runtime",
]

[tool.ruff]
line-length = 100
# SPR-03 initial-floor re-baseline (2026-06-02): bumped py311 -> py314 to
# match the CI runner + dev interpreter (both CPython 3.14). At py311 ruff
# emitted a PHANTOM `invalid-syntax` on a valid 3.12+ backslash-in-f-string
# (roles/note_taker/distill.py) and could abort `match` parsing — neither is
# a real defect on the 3.14 interpreter the code actually runs on. This is a
# tooling-target alignment, NOT a scope narrowing: no files=/exclude= added,
# the ruff `select` below is unchanged (G5).
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are idiomatic call-in-default usage,
# not the mutable-default bug B008 targets. Treat them as immutable calls.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
# SPR-03 initial-floor re-baseline (2026-06-02): bumped 3.11 -> 3.14 to match
# the CI runner + dev interpreter. Tooling-target alignment only; `strict`
# below is UNCHANGED and no files=/exclude= is added (G5).
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
# antiek-reader SPR-01: the document-model + reader-surface contract tests live
# beside the contracts they pin (``substrate/contracts/__tests__/``), per the
# spec's file scope. Added here so the default ``pytest`` run COLLECTS them — a
# test under a path outside ``testpaths`` would be silently dead (a fake gate).
testpaths = ["tests", "compounding/benchmark/tests", "substrate/contracts/__tests__"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring external services / live LLM / network",
    "slow: slow tests (full multi-arm benchmark runs); excluded from the fast CI suite via -m 'not slow'",
]
