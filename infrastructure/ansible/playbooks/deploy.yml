---
# ──────────────────────────────────────────────────────────────────────────
# Antiek — deploy a code change.
#
# Two plays:
#   1. Phase A (localhost) — build apps/reading/dist locally so the
#      frontend artifact exists. Skip with --skip-tags frontend.
#   2. Phase B (antiek_prod) — pull substrate code, refresh deps,
#      rsync the frontend dist, re-render templates, restart the
#      service, assert /health is green.
#
# Safety: fails the playbook if the health check doesn't return
# `registered_providers` non-empty. Better to surface a broken deploy
# immediately than to leave it silently degraded.
# ──────────────────────────────────────────────────────────────────────────

# Phase A — local frontend build (no SSH needed).
- name: Antiek frontend — build locally
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [frontend, build]

  tasks:
    - name: build apps/reading (vite production bundle)
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ playbook_dir }}/../../../apps/reading"
      changed_when: true

    - name: confirm dist artifact exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../apps/reading/dist/index.html"
      register: dist_stat

    - name: fail if dist/index.html missing
      ansible.builtin.fail:
        msg: |
          Vite build claimed success but
          apps/reading/dist/index.html doesn't exist. Check the
          stdout above + retry locally before re-running this
          playbook.
      when: not dist_stat.stat.exists


# Phase B — substrate + frontend rsync on the VM.
- name: Antiek substrate — deploy update
  hosts: antiek_prod
  become: true
  gather_facts: false

  tasks:
    # ── 1. Pull code ─────────────────────────────────────────────────────
    - name: git pull
      ansible.builtin.git:
        repo: "{{ antiek_repo_url }}"
        dest: "{{ antiek_install_dir }}"
        version: "{{ antiek_repo_branch }}"
        force: false
      become_user: "{{ antiek_user }}"
      register: git_pull
      tags: [code]

    - name: report git revision
      ansible.builtin.debug:
        msg: "now at {{ git_pull.after | default('(unchanged)') }}"
      tags: [code]

    # ── 2. Refresh dependencies ──────────────────────────────────────────
    # `pip install -e` is fast when nothing changed (just re-reads
    # pyproject.toml and the existing egg-info), so running it
    # unconditionally is fine.
    - name: refresh editable install + extras
      ansible.builtin.pip:
        name: "{{ antiek_install_dir }}[pdf,urls,embedding]"
        editable: true
        virtualenv: "{{ antiek_install_dir }}/.venv"
      become_user: "{{ antiek_user }}"
      tags: [code]

    # ── 3. Re-render templates if they changed ───────────────────────────
    - name: re-render antiek.service
      ansible.builtin.template:
        src: ../templates/antiek.service.j2
        dest: /etc/systemd/system/antiek.service
        owner: root
        group: root
        mode: "0644"
      register: antiek_unit
      tags: [systemd]

    - name: systemd daemon-reload if unit changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: antiek_unit.changed
      tags: [systemd]

    # ── Frontend rsync ───────────────────────────────────────────────────
    # The Phase A play built `apps/reading/dist/` locally. Push it to
    # the VM via rsync; Caddy serves it from `{{ frontend_dist_dir }}`.
    # `delete: true` removes stale files left over from a previous
    # build (Vite's hashed asset names mean old files are dead weight,
    # not actively-referenced).
    - name: ensure frontend dist directory exists
      ansible.builtin.file:
        path: "{{ frontend_dist_dir }}"
        state: directory
        owner: "{{ frontend_dist_owner }}"
        group: "{{ frontend_dist_group }}"
        mode: "0755"
      tags: [frontend, caddy]

    - name: rsync apps/reading/dist → {{ frontend_dist_dir }}
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../apps/reading/dist/"
        dest: "{{ frontend_dist_dir }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
      become_user: root
      tags: [frontend, caddy]

    - name: ensure caddy can read the dist
      ansible.builtin.file:
        path: "{{ frontend_dist_dir }}"
        state: directory
        owner: "{{ frontend_dist_owner }}"
        group: "{{ frontend_dist_group }}"
        mode: "0755"
        recurse: true
      tags: [frontend, caddy]

    - name: re-render Caddyfile
      ansible.builtin.template:
        src: ../templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: "0644"
      register: caddyfile
      tags: [caddy]

    - name: caddy validate (catch syntax errors before reload)
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      changed_when: false
      tags: [caddy]

    # `caddy reload` (vs systemctl reload) fails LOUDLY on bad
    # config. systemctl reload sends SIGUSR1 + trusts caddy to apply;
    # if the hot-reload errors AFTER the signal, systemd reports
    # success anyway and the old config stays live.
    - name: caddy reload (synchronous; fails loud on bad config)
      ansible.builtin.command:
        cmd: caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
        chdir: /etc/caddy
      when: caddyfile.changed
      changed_when: true
      tags: [caddy]

    # Belt-and-braces: full restart so the route table is rebuilt
    # from scratch (Caddy hot-reload occasionally leaves stale
    # routes after big topology changes like adding `route`
    # blocks). ~1s of downtime, acceptable.
    - name: caddy restart (force-flush route table)
      ansible.builtin.systemd:
        name: caddy
        state: restarted
      when: caddyfile.changed
      tags: [caddy]

    - name: re-render backup script
      ansible.builtin.template:
        src: ../templates/backup.sh.j2
        dest: /usr/local/bin/antiek-backup
        owner: root
        group: "{{ antiek_group }}"
        mode: "0750"
      tags: [backup]

    # ── 4. Restart the substrate ────────────────────────────────────────
    - name: restart antiek
      ansible.builtin.systemd:
        name: antiek.service
        state: restarted
      tags: [restart]

    # ── 5. Wait for systemd to report it back up ────────────────────────
    - name: wait for systemd active
      ansible.builtin.command:
        cmd: systemctl is-active antiek.service
      register: systemd_status
      retries: 6
      delay: 5
      until: systemd_status.stdout == "active"
      changed_when: false
      tags: [verify]

    # ── 6. End-to-end health check via the public hostname ──────────────
    # Run from the playbook control node (delegate_to: localhost) so we
    # exercise the full Caddy → uvicorn path, not just the local socket.
    - name: GET /health from public endpoint
      ansible.builtin.uri:
        url: "https://{{ api_domain }}/health"
        return_content: true
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      delegate_to: localhost
      become: false
      tags: [verify]

    - name: assert providers registered
      # Fail the playbook hard if the secrets file isn't populated or
      # OpenRouter isn't loadable. Surfaces a broken deploy NOW rather
      # than later when an investigation fails.
      ansible.builtin.assert:
        that:
          - health.json.status == "ok"
          - health.json.registered_providers | length > 0
        fail_msg: |
          Deploy succeeded structurally but health check shows no
          registered providers. Almost certainly the secrets file is
          empty or malformed:
            ssh root@{{ inventory_hostname }} cat {{ antiek_secrets_file }}
        success_msg: |
          Deploy verified: substrate is live with providers
          {{ health.json.registered_providers }}.
      tags: [verify]

    # ── Frontend smoke check ────────────────────────────────────────────
    # GET the root URL through Caddy. Asserts the SPA is served + the
    # response is text/html (i.e. NOT the JSON 404 a reverse-proxy
    # miss would produce). Run from localhost for the same reason as
    # /health — we want to exercise the full TLS + path-split path.
    - name: GET / (SPA root) from public endpoint
      ansible.builtin.uri:
        url: "https://{{ api_domain }}/"
        return_content: true
        status_code: 200
        headers:
          Accept: "text/html"
      register: spa_root
      retries: 6
      delay: 5
      until: spa_root.status == 200
      delegate_to: localhost
      become: false
      tags: [verify, frontend]

    - name: assert SPA root returns HTML
      ansible.builtin.assert:
        that:
          - "'text/html' in (spa_root.content_type | default(''))"
          - "'<!doctype html>' in (spa_root.content | lower)"
        fail_msg: |
          GET https://{{ api_domain }}/ returned 200 but the response
          doesn't look like the reading-app SPA. Likely the
          @api_routes Caddy matcher consumed `/` by accident, or the
          dist directory was empty.
        success_msg: |
          Frontend verified: SPA serves on https://{{ api_domain }}/.
      tags: [verify, frontend]
