---
# ──────────────────────────────────────────────────────────────────────────
# Antiek — deploy a code change.
#
# Two plays:
#   1. Phase A (localhost) — build apps/reading/dist locally so the
#      frontend artifact exists. Skip with --skip-tags frontend.
#   2. Phase B (antiek_prod) — pull substrate code, refresh deps,
#      rsync the frontend dist, re-render templates, restart the
#      service, assert /health is green.
#
# Safety: fails the playbook if the health check doesn't return
# `registered_providers` non-empty. Better to surface a broken deploy
# immediately than to leave it silently degraded.
# ──────────────────────────────────────────────────────────────────────────

# Phase A — local frontend build (no SSH needed).
- name: Antiek frontend — build locally
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [frontend, build]

  tasks:
    - name: build apps/reading (vite production bundle)
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ playbook_dir }}/../../../apps/reading"
      changed_when: true

    - name: confirm dist artifact exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../apps/reading/dist/index.html"
      register: dist_stat

    - name: fail if dist/index.html missing
      ansible.builtin.fail:
        msg: |
          Vite build claimed success but
          apps/reading/dist/index.html doesn't exist. Check the
          stdout above + retry locally before re-running this
          playbook.
      when: not dist_stat.stat.exists


# Phase B — substrate + frontend rsync on the VM.
- name: Antiek substrate — deploy update
  hosts: antiek_prod
  become: true
  gather_facts: false

  tasks:
    # ── 1. Pull code ─────────────────────────────────────────────────────
    - name: git pull
      ansible.builtin.git:
        repo: "{{ antiek_repo_url }}"
        dest: "{{ antiek_install_dir }}"
        version: "{{ antiek_repo_branch }}"
        force: false
      become_user: "{{ antiek_user }}"
      register: git_pull
      tags: [code]

    - name: report git revision
      ansible.builtin.debug:
        msg: "now at {{ git_pull.after | default('(unchanged)') }}"
      tags: [code]

    # SPR-07: expose the just-pulled SHA to the antiek.service template so
    # ANTIEK_BUILD_SHA is stamped into the service env and /health reports
    # the true deployed SHA (the prod-parity check asserts against it).
    - name: set antiek_build_sha fact from the just-pulled SHA
      ansible.builtin.set_fact:
        antiek_build_sha: "{{ git_pull.after }}"
      when: git_pull.after is defined
      tags: [code, systemd]

    # ── 2. Refresh dependencies ──────────────────────────────────────────
    # `pip install -e` is fast when nothing changed (just re-reads
    # pyproject.toml and the existing egg-info), so running it
    # unconditionally is fine.
    - name: refresh editable install + extras
      ansible.builtin.pip:
        name: "{{ antiek_install_dir }}[pdf,urls,embedding]"
        editable: true
        virtualenv: "{{ antiek_install_dir }}/.venv"
      become_user: "{{ antiek_user }}"
      tags: [code]

    # ── 3. Re-render templates if they changed ───────────────────────────
    - name: re-render antiek.service
      ansible.builtin.template:
        src: ../templates/antiek.service.j2
        dest: /etc/systemd/system/antiek.service
        owner: root
        group: root
        mode: "0644"
      register: antiek_unit
      tags: [systemd]

    - name: re-render antiek-continuous-research.service (§7.3 + §7.4 daemon)
      ansible.builtin.template:
        src: ../templates/antiek-continuous-research.service.j2
        dest: /etc/systemd/system/antiek-continuous-research.service
        owner: root
        group: root
        mode: "0644"
      register: antiek_continuous_unit
      tags: [systemd, continuous]

    - name: re-render antiek-arxiv-oai-sync.service
      ansible.builtin.template:
        src: ../templates/antiek-arxiv-oai-sync.service.j2
        dest: /etc/systemd/system/antiek-arxiv-oai-sync.service
        owner: root
        group: root
        mode: "0644"
      register: antiek_arxiv_oai_sync_unit
      tags: [systemd, arxiv_oai]

    - name: re-render antiek-arxiv-oai-sync.timer
      ansible.builtin.template:
        src: ../templates/antiek-arxiv-oai-sync.timer.j2
        dest: /etc/systemd/system/antiek-arxiv-oai-sync.timer
        owner: root
        group: root
        mode: "0644"
      register: antiek_arxiv_oai_sync_timer
      tags: [systemd, arxiv_oai]

    - name: systemd daemon-reload if any unit changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: antiek_unit.changed or antiek_continuous_unit.changed or antiek_arxiv_oai_sync_unit.changed or antiek_arxiv_oai_sync_timer.changed
      tags: [systemd]

    - name: enable antiek-continuous-research.service
      ansible.builtin.systemd:
        name: antiek-continuous-research.service
        enabled: true
      tags: [systemd, continuous]

    - name: restart antiek-continuous-research if unit changed
      ansible.builtin.systemd:
        name: antiek-continuous-research.service
        state: restarted
      when: antiek_continuous_unit.changed
      tags: [systemd, continuous]

    - name: enable and start antiek-arxiv-oai-sync.timer
      ansible.builtin.systemd:
        name: antiek-arxiv-oai-sync.timer
        enabled: true
        state: started
      tags: [systemd, arxiv_oai]

    # ── Frontend rsync ───────────────────────────────────────────────────
    # The Phase A play built `apps/reading/dist/` locally. Push it to
    # the VM via rsync; Caddy serves it from `{{ frontend_dist_dir }}`.
    # `delete: true` removes stale files left over from a previous
    # build (Vite's hashed asset names mean old files are dead weight,
    # not actively-referenced).
    - name: ensure frontend dist directory exists
      ansible.builtin.file:
        path: "{{ frontend_dist_dir }}"
        state: directory
        owner: "{{ frontend_dist_owner }}"
        group: "{{ frontend_dist_group }}"
        mode: "0755"
      tags: [frontend, caddy]

    - name: rsync apps/reading/dist → {{ frontend_dist_dir }}
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../apps/reading/dist/"
        dest: "{{ frontend_dist_dir }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
      become_user: root
      tags: [frontend, caddy]

    - name: ensure caddy can read the dist
      ansible.builtin.file:
        path: "{{ frontend_dist_dir }}"
        state: directory
        owner: "{{ frontend_dist_owner }}"
        group: "{{ frontend_dist_group }}"
        mode: "0755"
        recurse: true
      tags: [frontend, caddy]

    # ── Cloudflare Tunnel ──────────────────────────────────────────────
    # The tunnel terminates Cloudflare-edge TLS + forwards the
    # cleartext payload to the VM. As of pass-9 frontend deploy, the
    # tunnel forwards to Caddy on 127.0.0.1:443 (NOT to uvicorn
    # directly). Caddy then path-splits API vs SPA.
    - name: read existing tunnel ID from VM
      ansible.builtin.shell: |
        # Tunnel ID is the name of the credentials JSON file (UUID).
        ls /etc/cloudflared/ | grep -E '^[0-9a-f-]+\.json$' | sed 's/\.json$//'
      register: tunnel_id_lookup
      changed_when: false
      tags: [cloudflared]

    - name: set cloudflared_tunnel_id fact
      ansible.builtin.set_fact:
        cloudflared_tunnel_id: "{{ tunnel_id_lookup.stdout | trim }}"
      tags: [cloudflared]

    - name: re-render cloudflared config.yml
      ansible.builtin.template:
        src: ../templates/cloudflared-config.yml.j2
        dest: /etc/cloudflared/config.yml
        owner: root
        group: root
        mode: "0644"
      register: cloudflared_config
      tags: [cloudflared]

    - name: restart cloudflared if config changed
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
      when: cloudflared_config.changed
      tags: [cloudflared]

    - name: re-render Caddyfile
      ansible.builtin.template:
        src: ../templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: "0644"
      register: caddyfile
      tags: [caddy]

    - name: caddy validate (catch syntax errors before reload)
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      changed_when: false
      tags: [caddy]

    # `caddy reload` (vs systemctl reload) fails LOUDLY on bad
    # config. systemctl reload sends SIGUSR1 + trusts caddy to apply;
    # if the hot-reload errors AFTER the signal, systemd reports
    # success anyway and the old config stays live.
    - name: caddy reload (synchronous; fails loud on bad config)
      ansible.builtin.command:
        cmd: caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
        chdir: /etc/caddy
      when: caddyfile.changed
      changed_when: true
      tags: [caddy]

    # Belt-and-braces: full restart so the route table is rebuilt
    # from scratch (Caddy hot-reload occasionally leaves stale
    # routes after big topology changes like adding `route`
    # blocks). ~1s of downtime, acceptable.
    - name: caddy restart (force-flush route table)
      ansible.builtin.systemd:
        name: caddy
        state: restarted
      when: caddyfile.changed
      tags: [caddy]

    - name: re-render backup script
      ansible.builtin.template:
        src: ../templates/backup.sh.j2
        dest: /usr/local/bin/antiek-backup
        owner: root
        group: "{{ antiek_group }}"
        mode: "0750"
      tags: [backup]

    # ── 3.5 Debug: what does Caddy think the route table is? ────────────
    - name: debug — fetch live Caddy config JSON
      ansible.builtin.command:
        cmd: curl -sf http://localhost:2019/config/apps/http/servers/srv0/routes
      register: caddy_routes
      changed_when: false
      tags: [caddy, debug]

    - name: debug — print Caddy route summary
      ansible.builtin.debug:
        var: caddy_routes.stdout
      tags: [caddy, debug]

    - name: debug — inspect cloudflared config + service
      ansible.builtin.shell: |
        echo "=== /etc/cloudflared listing ==="
        ls -la /etc/cloudflared/ 2>/dev/null || echo "no /etc/cloudflared"
        echo "=== config.yml ==="
        cat /etc/cloudflared/config.yml 2>/dev/null
        echo "=== systemctl status cloudflared ==="
        systemctl is-active cloudflared 2>/dev/null
      register: cf_inspect
      changed_when: false
      tags: [cloudflared, debug]

    - name: debug — print cloudflared state
      ansible.builtin.debug:
        var: cf_inspect.stdout_lines
      tags: [cloudflared, debug]

    - name: debug — tail caddy access log
      ansible.builtin.shell: |
        tail -3 /var/log/caddy/access.log 2>/dev/null || echo "no access log yet"
      register: caddy_log
      changed_when: false
      tags: [caddy, debug]

    - name: debug — print caddy access log
      ansible.builtin.debug:
        var: caddy_log.stdout_lines
      tags: [caddy, debug]

    - name: debug — make a public-side curl + check if it landed in Caddy log
      ansible.builtin.shell: |
        sleep 1
        echo "=== before request, last log line ==="
        tail -1 /var/log/caddy/access.log 2>/dev/null
        echo "=== curling api.antiek.ai/ from VM ==="
        curl -sk -o /dev/null "https://api.antiek.ai/" -w "HTTP %{http_code} type=%{content_type}\n"
        sleep 1
        echo "=== after request, last log line ==="
        tail -1 /var/log/caddy/access.log 2>/dev/null
      register: public_test
      changed_when: false
      tags: [caddy, debug]

    - name: debug — print public test
      ansible.builtin.debug:
        var: public_test.stdout_lines
      tags: [caddy, debug]

    - name: debug — netstat to see what Caddy binds to
      ansible.builtin.shell: |
        ss -tlnp 2>&1 | grep -E ':80|:443|:8001' | head
      register: caddy_bind
      changed_when: false
      tags: [caddy, debug]

    - name: debug — print bind info
      ansible.builtin.debug:
        var: caddy_bind.stdout_lines
      tags: [caddy, debug]

    - name: debug — curl Caddy via 127.0.0.1 and via host IP
      ansible.builtin.shell: |
        set +e
        echo "=== via 127.0.0.1:443 ==="
        curl -sk --resolve {{ api_domain }}:443:127.0.0.1 "https://{{ api_domain }}/" -o /tmp/r1.body -w "HTTP %{http_code} type=%{content_type} size=%{size_download}\n"
        echo "  body (200): $(head -c 200 /tmp/r1.body)"
        echo "=== via private IP ==="
        IP=$(hostname -I | awk '{print $1}')
        echo "host IP = $IP"
        curl -sk --resolve {{ api_domain }}:443:$IP "https://{{ api_domain }}/" -o /tmp/r2.body -w "HTTP %{http_code} type=%{content_type} size=%{size_download}\n"
        echo "  body (200): $(head -c 200 /tmp/r2.body)"
        echo "=== /index.html via 127.0.0.1 ==="
        curl -sk --resolve {{ api_domain }}:443:127.0.0.1 "https://{{ api_domain }}/index.html" -o /tmp/r3.body -w "HTTP %{http_code} type=%{content_type} size=%{size_download}\n"
        echo "  body (200): $(head -c 200 /tmp/r3.body)"
      register: caddy_direct
      changed_when: false
      tags: [caddy, debug]

    - name: debug — print direct Caddy response
      ansible.builtin.debug:
        var: caddy_direct.stdout_lines
      tags: [caddy, debug]

    - name: debug — ls /var/www/antiek-app
      ansible.builtin.command:
        cmd: ls -la /var/www/antiek-app/
      register: dist_ls
      changed_when: false
      tags: [frontend, debug]

    - name: debug — print dist listing
      ansible.builtin.debug:
        var: dist_ls.stdout
      tags: [frontend, debug]

    # ── 4. Restart the substrate ────────────────────────────────────────
    - name: restart antiek
      ansible.builtin.systemd:
        name: antiek.service
        state: restarted
      tags: [restart]

    # ── 5. Wait for systemd to report it back up ────────────────────────
    - name: wait for systemd active
      ansible.builtin.command:
        cmd: systemctl is-active antiek.service
      register: systemd_status
      retries: 6
      delay: 5
      until: systemd_status.stdout == "active"
      changed_when: false
      tags: [verify]

    # ── 6. End-to-end health check via the public hostname ──────────────
    # Run from the playbook control node (delegate_to: localhost) so we
    # exercise the full Caddy → uvicorn path, not just the local socket.
    - name: GET /health from public endpoint
      ansible.builtin.uri:
        url: "https://{{ api_domain }}/health"
        return_content: true
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      delegate_to: localhost
      become: false
      tags: [verify]

    - name: assert providers registered
      # Fail the playbook hard if the secrets file isn't populated or
      # OpenRouter isn't loadable. Surfaces a broken deploy NOW rather
      # than later when an investigation fails.
      ansible.builtin.assert:
        that:
          - health.json.status == "ok"
          - health.json.registered_providers | length > 0
        fail_msg: |
          Deploy succeeded structurally but health check shows no
          registered providers. Almost certainly the secrets file is
          empty or malformed:
            ssh root@{{ inventory_hostname }} cat {{ antiek_secrets_file }}
        success_msg: |
          Deploy verified: substrate is live with providers
          {{ health.json.registered_providers }}.
      tags: [verify]

    # ── 6b. Prod-parity assertion (SPR-07) — BLOCKING ───────────────────
    # The cheap catch the pipeline lacked: assert the SHA the LIVE service
    # reports equals the SHA that is checked out on the box, and that the
    # provider registry is non-empty. A stale-SPA drift shipped earlier
    # this month and went undetected because nothing compared the deployed
    # SHA against main. This is the BLOCKING surface (vs the informational
    # scheduled probe in .github/workflows/prod_parity.yml): at THIS moment
    # the deployed SHA is known and the URL is live, so a mismatch should
    # fail the play.
    #
    # WHAT WE COMPARE AGAINST (`antiek_expected_sha`), and WHY it is NOT a
    # raw `git_pull.after`:
    #   * On a full code deploy `git_pull.after` is the just-pulled SHA and
    #     is authoritative — use it directly.
    #   * On a verify-only / skip-code run (e.g. `--tags verify`, a
    #     systemd-only or frontend-only deploy) the `git pull` task (tagged
    #     [code]) never runs, so `git_pull.after` is UNDEFINED. The earlier
    #     shape of this task guarded on `when: git_pull.after is defined`,
    #     which turned the BLOCKING gate into a SILENT NO-OP on exactly
    #     those runs — the parity assertion would skip itself precisely
    #     when an operator re-runs verify to confirm prod is in parity.
    #     That is the one shape where a stale deploy is most likely. So we
    #     do NOT skip: we fall back to the SHA actually checked out on the
    #     box (`git rev-parse HEAD` in {{ antiek_install_dir }}), which IS
    #     what the running service was built from.
    # We deliberately do NOT default to `origin/main`: the deploy may
    # target a non-main ref and the control node may be on a different
    # checkout — the box's own HEAD is the authoritative "what is deployed
    # here". The deploy exports ANTIEK_BUILD_SHA into the service env (see
    # infrastructure/ansible/templates/antiek.service.j2) so /health reports
    # it; without that the assertion correctly reds.
    - name: read the SHA actually checked out on the box (verify-only fallback)
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ antiek_install_dir }}"
      become_user: "{{ antiek_user }}"
      register: deployed_head
      changed_when: false
      when: git_pull.after is not defined
      tags: [verify]

    - name: resolve antiek_expected_sha (just-pulled SHA, else box HEAD)
      ansible.builtin.set_fact:
        antiek_expected_sha: "{{ git_pull.after | default(deployed_head.stdout | trim) }}"
      tags: [verify]

    # ── Flywheel-liveness re-arm toggle (Antiek Convergence SPR-01 / M6) ──
    # `antiek_require_flywheel` appends `--require-flywheel` to the parity
    # check, promoting flywheel-liveness back to a BLOCKING post-deploy assert
    # (a deploy that brings up a dead flywheel FAILS the play). Default is
    # FALSE — and that is deliberate, NOT a weakening:
    #
    #   * #68 (commit 873d95b0, docs/decisions/prod-parity-flywheel-
    #     informational.md) demoted flywheel-liveness to informational because
    #     prod is dead for TWO reasons, and only ONE is a code defect:
    #       (a) the WIRE is dead — cascade_routes.py:367 omits
    #           retrieval_substrate (Antiek Convergence SPR-02 fixes this), and
    #       (b) prod is an EMPTY CORPUS — flywheel_ready also needs >=1
    #           knowledge.reused event from real research activity, which needs
    #           a corpus ingest (operator-gated; arXiv 429-banned).
    #   * Forcing --require-flywheel ON now would red EVERY correct deploy on
    #     the empty box — the exact false-block #68 removed. So we keep it OFF
    #     by default and gate the flip on BOTH conditions being true.
    #
    # FLIP TO TRUE (set `antiek_require_flywheel: true`, e.g. -e on the
    # command line or in group_vars) ONLY when BOTH hold — see
    # infrastructure/runbooks/flywheel-prod-cutover.md:
    #     (1) SPR-02 has landed the wire on the deployed SHA, AND
    #     (2) an operator corpus ingest has produced >=1 knowledge.reused
    #         event on prod (`/health` knowledge_reuse_count >= 1).
    # After the flip, a REGRESSION to a dead flywheel reds the deploy again
    # (the original SPR-11 intent, correctly sequenced after the wire + corpus
    # exist). This AGREES with the reachability gate's known-red window
    # (tools/reachability/known_red.json + docs/decisions/reachability-gate.md):
    # the flywheel is allowed red only during the SPR-01 -> SPR-02 fix window;
    # the in-process reachability probe greens on the WIRE alone (no corpus
    # needed), while this deploy assert additionally requires the prod corpus.
    - name: prod-parity assert — deployed SHA == box HEAD + providers live (+ flywheel when re-armed)
      ansible.builtin.command:
        # Run from the control node (delegate_to: localhost) so we exercise the
        # full public Caddy → uvicorn path, exactly like the /health task above.
        # tools/prod_parity/check.py exits non-zero on a parity failure;
        # `ansible.builtin.command` fails the play on that. This task has NO
        # `when:` guard on purpose — the blocking gate must fire on every deploy
        # shape, never silently skip itself. SHA + providers always block;
        # --require-flywheel (appended when antiek_require_flywheel is true)
        # additionally blocks on flywheel liveness.
        cmd: >-
          python {{ playbook_dir }}/../../../tools/prod_parity/check.py
          --url https://{{ api_domain }}
          --expected-sha {{ antiek_expected_sha }}
          {{ '--require-flywheel' if (antiek_require_flywheel | default(false) | bool) else '' }}
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [verify]

    # ── Flywheel-liveness REVIEW gate (Antiek Convergence SPR-01 / M6 part a) ──
    # The re-arm toggle above is CONDITION-gated (wire + corpus), NOT
    # date-expired — deliberately, because the corpus is operator-gated (arXiv
    # 429-banned) and a calendar force-red would wrongly red every correct
    # deploy onto the still-empty box (the exact false-block #68 removed). But
    # condition-gated-without-a-trigger is also the ONE place a dead-flywheel red
    # could be suppressed FOREVER with nothing forcing a re-look. This review
    # gate is that trigger: when today is PAST antiek_flywheel_review_date AND
    # the flywheel is STILL informational (toggle still false AND prod still
    # reports 0 reuse events), emit a LOUD warning forcing an explicit
    # operator re-justify-or-arm decision. It is NOT a hard force-red — see
    # above for why the literal M6 "date-expiry force-red" criterion would be
    # WRONG here (it would red correct deploys). The honest deviation from M6 is
    # stated in docs/decisions/prod-parity-flywheel-informational.md.
    #
    # "still informational" = the toggle is off AND prod's /health reports the
    # flywheel dead (knowledge_reuse_count <= 0 / flywheel_ready false). If
    # someone has already armed the toggle, OR prod is genuinely emitting reuse
    # events, the informational window is closed and no review is owed.
    - name: flywheel review — warn if still informational past the review date
      ansible.builtin.debug:
        msg: >-
          ::warning:: FLYWHEEL STILL INFORMATIONAL PAST REVIEW DATE
          ({{ antiek_flywheel_review_date }}). The deploy-side flywheel-liveness
          assert is still NOT blocking (antiek_require_flywheel is false) and
          prod still reports a dead flywheel
          (knowledge_reuse_count={{ health.json.knowledge_reuse_count | default('absent') }},
          flywheel_ready={{ health.json.flywheel_ready | default('absent') }}).
          This was justified during the SPR-01 -> SPR-02 fix window
          (docs/decisions/prod-parity-flywheel-informational.md), but that
          window's review horizon has passed. RE-JUSTIFY OR ARM: either land the
          SPR-02 wire + run the operator corpus ingest and flip
          antiek_require_flywheel=true
          (infrastructure/runbooks/flywheel-prod-cutover.md), or push
          antiek_flywheel_review_date out with a written reason. Do NOT leave it
          silently informational.
      when:
        - (now().date() | string) > antiek_flywheel_review_date
        - not (antiek_require_flywheel | default(false) | bool)
        - (health.json.knowledge_reuse_count | default(0) | int) <= 0
      tags: [verify]

    # ── Frontend smoke check ────────────────────────────────────────────
    # GET the root URL through Caddy. Asserts the SPA is served + the
    # response is text/html (i.e. NOT the JSON 404 a reverse-proxy
    # miss would produce). Run from localhost for the same reason as
    # /health — we want to exercise the full TLS + path-split path.
    - name: GET / (SPA root) from public endpoint
      ansible.builtin.uri:
        url: "https://{{ api_domain }}/"
        return_content: true
        status_code: 200
        headers:
          Accept: "text/html"
      register: spa_root
      retries: 6
      delay: 5
      until: spa_root.status == 200
      delegate_to: localhost
      become: false
      tags: [verify, frontend]

    - name: assert SPA root returns HTML
      ansible.builtin.assert:
        that:
          - "'text/html' in (spa_root.content_type | default(''))"
          - "'<!doctype html>' in (spa_root.content | lower)"
        fail_msg: |
          GET https://{{ api_domain }}/ returned 200 but the response
          doesn't look like the reading-app SPA. Likely the
          @api_routes Caddy matcher consumed `/` by accident, or the
          dist directory was empty.
        success_msg: |
          Frontend verified: SPA serves on https://{{ api_domain }}/.
      tags: [verify, frontend]

    # ── 7. Usability-keystone verify-live (Antiek Convergence SPR-08 / M3) ──────
    # The capstone: the SAME conjunction probe that gates merges in-process
    # (tools/reachability/probes/usability_keystone.py) re-run AGAINST LIVE PROD,
    # parameterized by ANTIEK_PROBE_BASE_URL. A green /health + green frontend can
    # both pass while the END-TO-END JOURNEY is broken — that is exactly the
    # dead-flywheel history this whole gate exists to kill (/health showed
    # knowledge_reuse_count=0 on live prod while every brick was green). This task
    # asserts the journey (login → launch → compound → read → §9 attribution) on
    # the real public hostname.
    #
    # OPERATOR-GATED (scope boundary, docs/decisions/usability-keystone.md): the
    # live run writes a real research to the PROD graph, needs PROD credentials,
    # and prod is HELD pending §9.0. So it is OFF by default and ARMED only by the
    # operator (antiek_keystone_verify_live=true + the three live credentials —
    # see infrastructure/runbooks/usability-keystone-verify-live.md). This task is
    # REQUIRED (it always runs; it is NEVER continue-on-error / silently skipped):
    #   * ARMED   → run the parameterized probe; a non-zero exit (any broken leg)
    #               FAILS the play.
    #   * NOT armed → FAIL THE TASK with a REMINDER that the live keystone is owed
    #               as the operator's post-deploy step, so it can never be silently
    #               forgotten. (Set `-e antiek_keystone_verify_live=skip_acknowledged`
    #               to record an explicit "I will run it by hand" acknowledgement
    #               and let the play proceed — a deliberate, logged opt-out, not a
    #               silent skip.)
    - name: usability keystone — run the live verify (ARMED) or refuse (scope boundary)
      ansible.builtin.command:
        # Run from the control node (delegate_to: localhost), exactly like the
        # /health + prod-parity tasks, so it exercises the full public path. The
        # probe is parameterized to LIVE mode by ANTIEK_PROBE_BASE_URL; the live
        # operator token + a real readable chunk id come from the environment
        # (supplied by the operator per the runbook — never minted by this play).
        # A non-zero exit (any broken leg) fails the play.
        cmd: >-
          python -m tools.reachability.probe_runner --only usability_keystone
        chdir: "{{ playbook_dir }}/../../.."
      environment:
        ANTIEK_PROBE_BASE_URL: "https://{{ api_domain }}"
        ANTIEK_PROBE_OPERATOR_TOKEN: "{{ lookup('env', 'ANTIEK_PROBE_OPERATOR_TOKEN') }}"
        ANTIEK_PROBE_READ_CHUNK_ID: "{{ lookup('env', 'ANTIEK_PROBE_READ_CHUNK_ID') }}"
      delegate_to: localhost
      become: false
      changed_when: false
      when: (antiek_keystone_verify_live | default(false) | string) == "true"
      tags: [verify, keystone]

    - name: usability keystone — REFUSE to silently skip the operator-gated live run
      # NOT armed and NOT explicitly acknowledged: fail the verify so the live
      # keystone can never be silently forgotten. This is the REQUIRED-step
      # discipline — the operator must either arm it, run it by hand and
      # acknowledge, or consciously defer with a recorded reason.
      ansible.builtin.fail:
        msg: |
          USABILITY KEYSTONE LIVE-VERIFY NOT RUN.
          The end-to-end keystone (login → launch → compound → read → §9
          attribution) was NOT exercised against live https://{{ api_domain }}.
          A green /health + green frontend can BOTH pass while the journey is
          broken — that is the dead-flywheel history this gate exists to kill.

          This live run is OPERATOR-GATED (it writes the prod graph + needs prod
          creds + prod is held pending §9.0). Choose ONE:
            (a) ARM it now:    -e antiek_keystone_verify_live=true  with
                ANTIEK_PROBE_OPERATOR_TOKEN + ANTIEK_PROBE_READ_CHUNK_ID set
                (infrastructure/runbooks/usability-keystone-verify-live.md), OR
            (b) ACKNOWLEDGE you will run it by hand post-deploy:
                -e antiek_keystone_verify_live=skip_acknowledged
          Do NOT leave it silently un-run.
      when: (antiek_keystone_verify_live | default(false) | string) not in ["true", "skip_acknowledged"]
      tags: [verify, keystone]

    - name: usability keystone — record an acknowledged manual-run deferral
      ansible.builtin.debug:
        msg: >-
          ::warning:: USABILITY KEYSTONE live-verify DEFERRED to a manual
          operator run (antiek_keystone_verify_live=skip_acknowledged). Run
          `python -m tools.reachability.probe_runner --only usability_keystone`
          with ANTIEK_PROBE_BASE_URL=https://{{ api_domain }} +
          ANTIEK_PROBE_OPERATOR_TOKEN + ANTIEK_PROBE_READ_CHUNK_ID post-deploy
          (infrastructure/runbooks/usability-keystone-verify-live.md). This
          deferral was explicitly acknowledged, not silently skipped.
      when: (antiek_keystone_verify_live | default(false) | string) == "skip_acknowledged"
      tags: [verify, keystone]
